name: AXEV 3D — Gerar Cenário

on:
  workflow_dispatch:
    inputs:

      # 1
      scene_id:
        description: "ID do cenário"
        required: true
        type: string
        default: "scene_001"

      # 2
      scene_name:
        description: "Nome do cenário"
        required: true
        type: string
        default: "AXEV Scene"

      # 3
      location:
        description: "Localização / set"
        required: true
        type: choice
        default: "neon_street"
        options:
          - "neon_street"
          - "neon_alley"
          - "daylight_alley"
          - "highway"
          - "military_base"
          - "prison_cell"
          - "prison_yard"
          - "police_room"
          - "hospital_room"
          - "rooftop"
          - "forest_trail"
          - "beach"
          - "harbour"
          - "nightclub"
          - "street_cafe"
          - "boardroom"
          - "open_plan_office"
          - "warehouse"
          - "church"
          - "football_stadium"

      # 4
      scene_duration:
        description: "Duração total (segundos, máx 60)"
        required: true
        type: choice
        default: "15"
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
          - "45"
          - "60"

      # 5 ── PERSONAGEM 1 (obrigatório)
      char1_preset:
        description: "Personagem 1 — Preset"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Gangster"
          - "The Secret Agent"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "Detective"
          - "The Corporate High-Flier"
          - "The Female Executive"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
          - "The Wasteland Survivor"
          - "The Priest"
          - "The Covert Spy"

      # 6
      char1_gender_age:
        description: "Personagem 1 — Género:Idade"
        required: true
        type: choice
        default: "male:25"
        options:
          - "male:18"
          - "male:25"
          - "male:30"
          - "male:40"
          - "male:50"
          - "female:18"
          - "female:25"
          - "female:30"
          - "female:40"

      # 7
      char1_action:
        description: "Personagem 1 — Acção principal"
        required: true
        type: choice
        default: "idle"
        options:
          - "idle"
          - "walk"
          - "run"
          - "talk"
          - "punch_combo"
          - "front_kick"
          - "fighting_stance"
          - "sword_combo"
          - "rifle_fire"
          - "pistol_fire"
          - "take_cover"
          - "cover_fire"
          - "shot_chest"
          - "rifle_death_forward"
          - "wave"
          - "phone_call"
          - "looking_around"
          - "drive_car"
          - "drive_motorcycle"
          - "ride_horse"
          - "fly_helicopter"

      # 8
      char1_weapon:
        description: "Personagem 1 — Arma"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "pistol"
          - "rifle"
          - "sword"
          - "knife"

      # 9
      char1_position:
        description: "Personagem 1 — Posição (x:z:yaw)"
        required: true
        type: choice
        default: "0:0:0"
        options:
          - "0:0:0"
          - "-2:0:0"
          - "2:0:0"
          - "0:2:180"
          - "-2:2:30"
          - "2:2:330"
          - "0:4:180"
          - "-4:0:90"
          - "4:0:270"

      # 10 ── PERSONAGEM 2 (opcional)
      char2_preset:
        description: "Personagem 2 — Preset (none = sem P2)"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Gangster"
          - "The Secret Agent"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "Detective"
          - "The Corporate High-Flier"
          - "The Female Executive"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
          - "The Wasteland Survivor"
          - "The Priest"

      # 11
      char2_gender_age:
        description: "Personagem 2 — Género:Idade"
        required: true
        type: choice
        default: "male:30"
        options:
          - "male:18"
          - "male:25"
          - "male:30"
          - "male:40"
          - "male:50"
          - "female:18"
          - "female:25"
          - "female:30"
          - "female:40"

      # 12
      char2_action:
        description: "Personagem 2 — Acção principal"
        required: true
        type: choice
        default: "idle"
        options:
          - "idle"
          - "walk"
          - "run"
          - "talk"
          - "punch_combo"
          - "front_kick"
          - "fighting_stance"
          - "sword_combo"
          - "rifle_fire"
          - "pistol_fire"
          - "take_cover"
          - "cover_fire"
          - "shot_chest"
          - "rifle_death_forward"
          - "wave"
          - "phone_call"
          - "looking_around"

      # 13
      char2_weapon:
        description: "Personagem 2 — Arma"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "pistol"
          - "rifle"
          - "sword"
          - "knife"

      # 14
      char2_position:
        description: "Personagem 2 — Posição (x:z:yaw)"
        required: true
        type: choice
        default: "2:0:180"
        options:
          - "0:0:0"
          - "-2:0:180"
          - "2:0:180"
          - "0:2:180"
          - "-2:2:30"
          - "2:2:330"
          - "0:4:0"
          - "-4:0:270"
          - "4:0:90"

      # 15 ── CÂMARA
      camera_framing:
        description: "Enquadramento da câmara"
        required: true
        type: choice
        default: "full_body"
        options:
          - "full_body"
          - "medium"
          - "close_up"
          - "wide_establishing"

      camera_angle:
        description: "Ângulo da câmara (graus)"
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "45"
          - "90"
          - "135"
          - "180"
          - "225"
          - "270"
          - "315"

      camera_elevation:
        description: "Elevação da câmara"
        required: true
        type: choice
        default: "eye_level"
        options:
          - "low_angle"
          - "eye_level"
          - "high_angle"
          - "bird_eye"

      # 16 ── MÚSICA
      music:
        description: "Música de fundo"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "dramatic_adventure"
          - "spy_opening"
          - "spy_mission"
          - "urban_hip_hop"
          - "horror"
          - "afrobeat"
          - "jazz_restaurant"
          - "tropical_pop"
          - "old_school_salsa"

      # 17 ── EXPORT
      export_format:
        description: "Formato de export do cenário"
        required: true
        type: choice
        default: "json_glb_mp4"
        options:
          - "json"
          - "json_and_catalog"
          - "json_glb_mp4"

      # 18 ── RESOLUÇÃO DO MP4
      mp4_resolution:
        description: "Resolução do MP4 (apenas para json_glb_mp4)"
        required: true
        type: choice
        default: "720"
        options:
          - "480"
          - "720"
          - "1080"

permissions:
  contents: read

concurrency:
  group: axev-scene-${{ github.ref }}-${{ inputs.scene_id }}
  cancel-in-progress: false

jobs:
  generate-scene:
    name: "Gerar cenário"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. VALIDAÇÃO ────────────────────────────────────────────────────
      - name: Validar inputs
        env:
          INPUT_SCENE_ID:  ${{ inputs.scene_id }}
          INPUT_DURATION:  ${{ inputs.scene_duration }}
        run: |
          set -euo pipefail

          if ! echo "$INPUT_SCENE_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::scene_id inválido: '$INPUT_SCENE_ID'"
            exit 1
          fi

          if [ "$INPUT_DURATION" -gt 60 ] 2>/dev/null; then
            echo "::error::Duração máxima é 60 segundos."
            exit 1
          fi

          echo "✅ Inputs validados."

      # ─── 2. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout AXEV
        uses: actions/checkout@v4

      # ─── 3. CONSTRUIR JSON DO CENÁRIO ────────────────────────────────────
      - name: Construir JSON do cenário (Ara Studio format)
        env:
          SCENE_ID:        ${{ inputs.scene_id }}
          SCENE_NAME:      ${{ inputs.scene_name }}
          LOCATION:        ${{ inputs.location }}
          DURATION:        ${{ inputs.scene_duration }}
          CHAR1_PRESET:    ${{ inputs.char1_preset }}
          CHAR1_GENDER_AGE: ${{ inputs.char1_gender_age }}
          CHAR1_ACTION:    ${{ inputs.char1_action }}
          CHAR1_WEAPON:    ${{ inputs.char1_weapon }}
          CHAR1_POSITION:  ${{ inputs.char1_position }}
          CHAR2_PRESET:    ${{ inputs.char2_preset }}
          CHAR2_GENDER_AGE: ${{ inputs.char2_gender_age }}
          CHAR2_ACTION:    ${{ inputs.char2_action }}
          CHAR2_WEAPON:    ${{ inputs.char2_weapon }}
          CHAR2_POSITION:  ${{ inputs.char2_position }}
          CAMERA_FRAMING:  ${{ inputs.camera_framing }}
          CAMERA_ANGLE:    ${{ inputs.camera_angle }}
          CAMERA_ELEVATION: ${{ inputs.camera_elevation }}
          MUSIC:           ${{ inputs.music }}
          RUN_NUMBER:      ${{ github.run_number }}
          REPO:            ${{ github.repository }}
        run: |
          mkdir -p axev-build axev-output

          python3 << 'PYEOF'
          import json, os
          from pathlib import Path

          def env(k, d=""): return os.environ.get(k, d).strip()

          scene_id    = env("SCENE_ID")
          scene_name  = env("SCENE_NAME")
          location    = env("LOCATION")
          duration    = int(env("DURATION", "15"))
          music       = env("MUSIC", "none")
          run_number  = env("RUN_NUMBER")
          repo        = env("REPO")

          # ── Câmara ───────────────────────────────────────────────────────
          FRAMING_MAP = {
            "full_body": "full", "medium": "medium",
            "close_up": "close", "wide_establishing": "full"
          }
          ELEVATION_MAP = {
            "low_angle": -15, "eye_level": 0,
            "high_angle": 20, "bird_eye": 45
          }
          framing   = FRAMING_MAP.get(env("CAMERA_FRAMING"), "full")
          angle     = int(env("CAMERA_ANGLE", "0"))
          elevation = ELEVATION_MAP.get(env("CAMERA_ELEVATION"), 0)

          # ── Helper: parsear posição ───────────────────────────────────────
          def parse_pos(s):
            parts = s.split(":")
            x   = float(parts[0]) if len(parts) > 0 else 0.0
            z   = float(parts[1]) if len(parts) > 1 else 0.0
            yaw = float(parts[2]) if len(parts) > 2 else 0.0
            return x, z, yaw

          # ── Helper: construir actor ───────────────────────────────────────
          def build_actor(prefix, actor_id):
            preset   = env(f"{prefix}_PRESET")
            ga       = env(f"{prefix}_GENDER_AGE", "male:25").split(":")
            action   = env(f"{prefix}_ACTION", "idle")
            weapon   = env(f"{prefix}_WEAPON", "none")
            pos_str  = env(f"{prefix}_POSITION", "0:0:0")
            x, z, yaw = parse_pos(pos_str)

            gender_val = 0.0 if ga[0] == "female" else 1.0
            age_val    = int(ga[1]) if len(ga) > 1 else 25

            LOOP_ACTIONS = {"idle","walk","run","talk","fighting_stance","cover_fire",
                            "phone_call","looking_around","drive_car","drive_motorcycle",
                            "ride_horse","fly_helicopter","take_cover"}
            clip_duration = duration if action in LOOP_ACTIONS else min(3, duration)

            actor = {
              "id": actor_id,
              "preset": preset,
              "params": {
                "gender": gender_val,
                "ageYears": age_val,
              },
              "x": x, "y": 0, "z": z, "yaw": yaw,
              "beats": [
                {
                  "clip": action,
                  "duration": clip_duration,
                  "move": action in {"walk","run"},
                }
              ]
            }

            if weapon != "none":
              actor["weapon"] = weapon

            return actor

          # ── Construir cast ────────────────────────────────────────────────
          cast = [build_actor("CHAR1", "char1")]
          if env("CHAR2_PRESET") != "none":
            cast.append(build_actor("CHAR2", "char2"))

          # ── Câmara shots ──────────────────────────────────────────────────
          camera_shots = [
            {
              "id": "shot1",
              "shot": framing,
              "target": "all" if len(cast) > 1 else "char1",
              "start": 0,
              "duration": duration,
            }
          ]

          # ── Música ────────────────────────────────────────────────────────
          MUSIC_IDS = {
            "dramatic_adventure": "dramatic-adventure-trailer",
            "spy_opening":        "spy-opening-scene",
            "spy_mission":        "spy-agent-mission-music",
            "urban_hip_hop":      "urban-hip-hop-beat",
            "horror":             "horror",
            "afrobeat":           "afrobeat-instrumental",
            "jazz_restaurant":    "jazz-restaurant-music",
            "tropical_pop":       "tropical-relaxing-pop",
            "old_school_salsa":   "old-school-salsa-02",
          }
          audio = {"muted": True, "speech": [], "effects": []}
          if music != "none" and music in MUSIC_IDS:
            audio["muted"] = False
            audio["music"] = {
              "track": MUSIC_IDS[music],
              "volume": 0.7,
            }
          else:
            audio["music"] = {"track": "none"}

          # ── Montar JSON final (Ara Studio v2 format) ──────────────────────
          scene_json = {
            "kind": "ara-studio",
            "version": 2,
            "title": scene_name,
            "template": location.replace("_", "-"),
            "camera": "locked",
            "aspect": "landscape",
            "caption": False,
            "texts": [],
            "view": {
              "azimuth": angle,
              "elevation": elevation,
              "zoom": 1.0
            },
            "actors": cast,
            "shots": camera_shots,
            "audio": audio,
            "meta": {
              "id": scene_id,
              "run": int(run_number) if run_number else 0,
              "repo": repo,
            },
          }

          out = Path("axev-build/scene.json")
          out.write_text(json.dumps(scene_json, indent=2, ensure_ascii=False))
          print(f"✅ JSON do cenário gerado: {out}")
          print(f"   Template: {scene_json['template']}")
          print(f"   Cast: {len(cast)} personagem(ns)")
          print(f"   Duração: {duration}s")
          print(f"   Música: {music}")
          PYEOF

      # ─── 4. GERAR CATÁLOGO DO CENÁRIO ────────────────────────────────────
      - name: Gerar catálogo do cenário
        env:
          SCENE_ID:        ${{ inputs.scene_id }}
          SCENE_NAME:      ${{ inputs.scene_name }}
          LOCATION:        ${{ inputs.location }}
          DURATION:        ${{ inputs.scene_duration }}
          CHAR1_PRESET:    ${{ inputs.char1_preset }}
          CHAR1_GENDER_AGE: ${{ inputs.char1_gender_age }}
          CHAR1_ACTION:    ${{ inputs.char1_action }}
          CHAR1_WEAPON:    ${{ inputs.char1_weapon }}
          CHAR1_POSITION:  ${{ inputs.char1_position }}
          CHAR2_PRESET:    ${{ inputs.char2_preset }}
          CHAR2_GENDER_AGE: ${{ inputs.char2_gender_age }}
          CHAR2_ACTION:    ${{ inputs.char2_action }}
          CHAR2_WEAPON:    ${{ inputs.char2_weapon }}
          CHAR2_POSITION:  ${{ inputs.char2_position }}
          CAMERA_FRAMING:  ${{ inputs.camera_framing }}
          CAMERA_ANGLE:    ${{ inputs.camera_angle }}
          CAMERA_ELEVATION: ${{ inputs.camera_elevation }}
          MUSIC:           ${{ inputs.music }}
          EXPORT_FORMAT:   ${{ inputs.export_format }}
          RUN_NUMBER:      ${{ github.run_number }}
          REPO:            ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          def env(k, d=""): return os.environ.get(k, d).strip()

          scene_id     = env("SCENE_ID")
          scene_name   = env("SCENE_NAME")
          location     = env("LOCATION")
          duration     = env("DURATION")
          char1_preset = env("CHAR1_PRESET")
          char1_ga     = env("CHAR1_GENDER_AGE")
          char1_action = env("CHAR1_ACTION")
          char1_weapon = env("CHAR1_WEAPON")
          char1_pos    = env("CHAR1_POSITION")
          char2_preset = env("CHAR2_PRESET")
          char2_ga     = env("CHAR2_GENDER_AGE")
          char2_action = env("CHAR2_ACTION")
          char2_weapon = env("CHAR2_WEAPON")
          char2_pos    = env("CHAR2_POSITION")
          cam_framing  = env("CAMERA_FRAMING")
          cam_angle    = env("CAMERA_ANGLE")
          cam_elev     = env("CAMERA_ELEVATION")
          music        = env("MUSIC")
          export_fmt   = env("EXPORT_FORMAT")
          run_number   = env("RUN_NUMBER")
          repo         = env("REPO")
          gen_date     = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          scene_path = Path("axev-build/scene.json")
          scene_data = json.loads(scene_path.read_text())
          scene_hash = hashlib.sha256(scene_path.read_bytes()).hexdigest()[:16] + "…"
          cast_count = len(scene_data.get("actors", scene_data.get("cast", [])))

          cast_rows = f"| char1 | {char1_preset} | {char1_ga} | {char1_action} | {char1_weapon} | {char1_pos} |"
          if char2_preset != "none":
            cast_rows += f"\n| char2 | {char2_preset} | {char2_ga} | {char2_action} | {char2_weapon} | {char2_pos} |"

          md = f"""# AXEV Scene Catalog
          ## Identificação
          | Campo | Valor |
          |---|---|
          | id | `{scene_id}` |
          | nome | {scene_name} |
          | run | #{run_number} |
          | repo | {repo} |
          | hash | `{scene_hash}` |
          | data | {gen_date} |
          | export | {export_fmt} |

          ## Cast
          | ID | Preset | Género/Idade | Acção | Arma | Posição |
          |---|---|---|---|---|---|
          {cast_rows}

          ## Câmara
          | Campo | Valor |
          |---|---|
          | enquadramento | {cam_framing} |
          | ângulo | {cam_angle}° |
          | elevação | {cam_elev} |

          ## Áudio
          | Campo | Valor |
          |---|---|
          | música | {music} |

          ### scene.json
          ```json
          {json.dumps(scene_data, indent=2, ensure_ascii=False)}
          ```
          *Pipeline: ara-axev-scene.yml · Run #{run_number} · {gen_date}*
          """

          out = Path("axev-output/AXEV_SCENE_CATALOG.md")
          out.write_text(md, encoding="utf-8")
          print(f"✅ Catálogo gerado: {out} ({out.stat().st_size} bytes)")
          PYEOF

      # ─── 5. CONFIGURAR NODE + CLONAR 3D-GEN (apenas para GLB/MP4) ────────
      - name: Configurar Node.js 20
        if: inputs.export_format == 'json_glb_mp4'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clonar Ara 3D Gen
        if: inputs.export_format == 'json_glb_mp4'
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      - name: Instalar dependências
        if: inputs.export_format == 'json_glb_mp4'
        working-directory: ara-3d-gen
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Cache assets MakeHuman
        if: inputs.export_format == 'json_glb_mp4'
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            ara-3d-gen/vendor
            ara-3d-gen/public/assets
          key: ara3d-assets-v1-${{ hashFiles('ara-3d-gen/scripts/setup-assets.ts', 'ara-3d-gen/scripts/mocap-takes.ts') }}
          restore-keys: ara3d-assets-v1-

      - name: Preparar assets 3D
        if: inputs.export_format == 'json_glb_mp4'
        working-directory: ara-3d-gen
        run: |
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ] || [ ! -d "vendor/sys/skins" ]; then
            echo "A descarregar assets MakeHuman (~280 MB)..."
            npm run setup-assets
          else
            echo "✅ Assets em cache."
          fi

      # ─── 6. GERAR GLB DOS PERSONAGENS ────────────────────────────────────
      - name: Gerar GLB dos personagens da cena
        if: inputs.export_format == 'json_glb_mp4'
        working-directory: ara-3d-gen
        env:
          CHAR1_PRESET:     ${{ inputs.char1_preset }}
          CHAR1_GENDER_AGE: ${{ inputs.char1_gender_age }}
          CHAR1_WEAPON:     ${{ inputs.char1_weapon }}
          CHAR2_PRESET:     ${{ inputs.char2_preset }}
          CHAR2_GENDER_AGE: ${{ inputs.char2_gender_age }}
          CHAR2_WEAPON:     ${{ inputs.char2_weapon }}
        run: |
          set -euo pipefail
          mkdir -p out ../axev-output/glb

          # ── Construir params para cada personagem e exportar GLB ──────────
          python3 << 'PYEOF'
          import json, os, subprocess
          from pathlib import Path

          def env(k, d=""): return os.environ.get(k, d).strip()

          def build_params(preset, gender_age, weapon):
            ga = gender_age.split(":")
            gender_str = ga[0] if ga else "male"
            age = int(ga[1]) if len(ga) > 1 else 25

            muscle_map = {"none":0.1,"slim":0.3,"medium":0.5,"athletic":0.7,"muscular":0.85}
            weight_map = {"very slim":0.15,"slim":0.3,"average":0.5,"heavy":0.7}
            height_map = {"very short":0.1,"short":0.3,"average":0.5,"tall":0.7,"very tall":0.9}

            params = {
              "name": preset,
              "detail": "medium",
              "gender": 0.0 if gender_str == "female" else 1.0,
              "ageYears": age,
              "muscle": 0.5,
              "weight": 0.5,
              "height": 0.5,
              "rig": "game",
              "animations": True,
              "restPose": "A",
              "faceShapes": True,
              "speechShapes": False,
              "faceBones": True,
            }
            if weapon not in ("none", ""):
              params["weapon"] = weapon
            return params

          chars = [
            ("char1", env("CHAR1_PRESET"), env("CHAR1_GENDER_AGE"), env("CHAR1_WEAPON")),
          ]
          char2_preset = env("CHAR2_PRESET")
          if char2_preset and char2_preset != "none":
            chars.append(("char2", char2_preset, env("CHAR2_GENDER_AGE"), env("CHAR2_WEAPON")))

          for char_id, preset, gender_age, weapon in chars:
            params_path = Path(f"../axev-build/{char_id}.params.json")
            params_path.write_text(json.dumps(build_params(preset, gender_age, weapon), indent=2))
            print(f"✅ Params {char_id}: {preset} ({gender_age})")
          PYEOF

          # Exportar GLB para cada personagem
          CHAR1_PRESET="${{ inputs.char1_preset }}"
          CHAR2_PRESET="${{ inputs.char2_preset }}"

          echo "▶ A exportar GLB do char1: $CHAR1_PRESET"
          npm run export -- \
            --params "../axev-build/char1.params.json" \
            --formats "glb" \
            --out "out/char1"

          if [ "$CHAR2_PRESET" != "none" ]; then
            echo "▶ A exportar GLB do char2: $CHAR2_PRESET"
            npm run export -- \
              --params "../axev-build/char2.params.json" \
              --formats "glb" \
              --out "out/char2"
          fi

          # Copiar GLBs para output
          find out -name "*.glb" | while read f; do
            char=$(echo "$f" | grep -oP 'char[12]')
            cp "$f" "../axev-output/glb/AXEV_${char^^}.glb"
            SIZE=$(stat -c%s "$f")
            echo "✅ GLB exportado: AXEV_${char^^}.glb ($(( SIZE / 1024 )) KB)"
          done

      # ─── 7. GERAR MP4 DA CENA (Chromium headless + studio.exportMovie) ───
      - name: Instalar Chromium
        if: inputs.export_format == 'json_glb_mp4'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            chromium-browser \
            xvfb \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2
          echo "CHROME=$(which chromium-browser || which chromium)" >> $GITHUB_ENV
          echo "✅ Chromium: $(chromium-browser --version 2>/dev/null || chromium --version)"

      - name: Build Ara Studio (dist)
        if: inputs.export_format == 'json_glb_mp4'
        working-directory: ara-3d-gen
        run: |
          npm run build -- --logLevel error
          echo "✅ Build concluído: $(du -sh dist | cut -f1)"

      - name: Exportar MP4 da cena via Chromium headless
        if: inputs.export_format == 'json_glb_mp4'
        working-directory: ara-3d-gen
        env:
          SCENE_JSON_PATH: ${{ github.workspace }}/axev-build/scene.json
          OUTPUT_PATH:     ${{ github.workspace }}/axev-output
          SCENE_ID:        ${{ inputs.scene_id }}
          MP4_RESOLUTION:  ${{ inputs.mp4_resolution }}
          CHROME:          ${{ env.CHROME }}
        run: |
          cat > export-scene-mp4.ts << 'TSEOF'
          import { spawn } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync, existsSync, mkdtempSync, rmSync, statSync } from 'node:fs';
          import { createServer } from 'node:http';
          import { tmpdir } from 'node:os';
          import { extname, join, normalize } from 'node:path';
          import type { Readable, Writable } from 'node:stream';

          const CHROME = process.env.CHROME ?? '';
          const SCENE_JSON_PATH = process.env.SCENE_JSON_PATH ?? '';
          const OUTPUT_PATH = process.env.OUTPUT_PATH ?? '';
          const SCENE_ID = process.env.SCENE_ID ?? 'scene';
          const RESOLUTION = parseInt(process.env.MP4_RESOLUTION ?? '720', 10);
          const DIST = join(import.meta.dirname, '../dist');

          if (!CHROME || !existsSync(CHROME)) throw new Error(`Chrome não encontrado: ${CHROME}`);
          if (!existsSync(SCENE_JSON_PATH)) throw new Error(`scene.json não encontrado: ${SCENE_JSON_PATH}`);

          const sceneProject = JSON.parse(readFileSync(SCENE_JSON_PATH, 'utf8'));
          mkdirSync(OUTPUT_PATH, { recursive: true });

          // Dimensões por resolução
          const DIMS: Record<number, [number, number]> = {
            480:  [854,  480],
            720:  [1280, 720],
            1080: [1920, 1080],
          };
          const [width, height] = DIMS[RESOLUTION] ?? [1280, 720];
          console.log(`▶ Resolução: ${width}×${height} (${RESOLUTION}p)`);

          // Servidor HTTP local para servir o dist
          const TYPES: Record<string, string> = {
            '.html': 'text/html', '.js': 'text/javascript', '.css': 'text/css',
            '.json': 'application/json', '.svg': 'image/svg+xml', '.webp': 'image/webp',
            '.png': 'image/png', '.jpg': 'image/jpeg', '.pack': 'application/octet-stream',
            '.txt': 'text/plain', '.webmanifest': 'application/manifest+json',
            '.mp3': 'audio/mpeg', '.wasm': 'application/wasm', '.mjs': 'text/javascript',
          };
          const server = createServer((req, res) => {
            let path = normalize(join(DIST, decodeURIComponent((req.url ?? '/').split('?')[0])));
            if (existsSync(path) && statSync(path).isDirectory()) path = join(path, 'index.html');
            if (!path.startsWith(DIST) || !existsSync(path)) { res.statusCode = 404; res.end(); return; }
            res.setHeader('Content-Type', TYPES[extname(path)] ?? 'application/octet-stream');
            res.end(readFileSync(path));
          });
          await new Promise<void>((r) => server.listen(4422, r));
          console.log('✅ Servidor HTTP iniciado em :4422');

          // Iniciar Chromium com DevTools pipe
          const profile = mkdtempSync(join(tmpdir(), 'axev-mp4-'));
          const chrome = spawn(CHROME, [
            '--headless=new',
            '--use-angle=swiftshader',
            '--enable-unsafe-swiftshader',
            '--use-fake-ui-for-media-stream',
            '--use-fake-device-for-media-stream',
            '--autoplay-policy=no-user-gesture-required',
            '--no-first-run',
            '--disable-gpu-sandbox',
            '--no-sandbox',
            `--user-data-dir=${profile}`,
            '--remote-debugging-pipe',
            `--window-size=${width},${height}`,
            'about:blank',
          ], { stdio: ['ignore', 'inherit', 'inherit', 'pipe', 'pipe'] });

          const toChrome = chrome.stdio[3] as Writable;
          const fromChrome = chrome.stdio[4] as Readable;

          const cleanup = async () => {
            const exited = chrome.exitCode !== null
              ? Promise.resolve()
              : new Promise<void>((r) => chrome.once('exit', () => r()));
            chrome.kill();
            server.close();
            await exited;
            rmSync(profile, { recursive: true, force: true, maxRetries: 5, retryDelay: 200 });
          };

          let nextId = 0, session: string | undefined, buf = '';
          const pending = new Map<number, (m: { result?: unknown; error?: { message: string } }) => void>();
          const errors: string[] = [];

          fromChrome.on('data', (c: Buffer) => {
            buf += c.toString('utf8');
            let i;
            while ((i = buf.indexOf('\0')) >= 0) {
              const m = JSON.parse(buf.slice(0, i));
              buf = buf.slice(i + 1);
              if (m.id !== undefined) pending.get(m.id)?.(m);
              else if (m.method === 'Runtime.exceptionThrown')
                errors.push(m.params.exceptionDetails.exception?.description ?? m.params.exceptionDetails.text);
            }
          });

          function send<T = Record<string, unknown>>(method: string, params: object = {}, withSession = true): Promise<T> {
            const id = ++nextId;
            return new Promise((resolve, reject) => {
              pending.set(id, (m) => (m.error ? reject(new Error(`${method}: ${m.error.message}`)) : resolve(m.result as T)));
              toChrome.write(JSON.stringify({ id, method, params, ...(withSession && session ? { sessionId: session } : {}) }) + '\0');
            });
          }

          async function evaluate<T>(js: string): Promise<T> {
            const r = await send<{ result: { value: T }; exceptionDetails?: { text: string; exception?: { description?: string } } }>(
              'Runtime.evaluate', { expression: js, returnByValue: true, awaitPromise: true }
            );
            if (r.exceptionDetails) throw new Error(r.exceptionDetails.exception?.description ?? r.exceptionDetails.text);
            return r.result.value;
          }

          async function waitFor(js: string, what: string, ms = 180000): Promise<void> {
            const end = Date.now() + ms;
            while (Date.now() < end) {
              if (await evaluate<boolean>(js).catch(() => false)) return;
              await new Promise((r) => setTimeout(r, 500));
            }
            throw new Error(`Timeout a aguardar: ${what}`);
          }

          const pause = (ms = 300) => new Promise((r) => setTimeout(r, ms));

          try {
            const { targetId } = await send<{ targetId: string }>('Target.createTarget', { url: 'about:blank' }, false);
            ({ sessionId: session } = await send<{ sessionId: string }>('Target.attachToTarget', { targetId, flatten: true }, false));
            await send('Runtime.enable');
            await send('Page.enable');
            await send('Emulation.setDeviceMetricsOverride', { width, height, deviceScaleFactor: 1, mobile: false });

            // Suprimir tour no Studio
            await send('Page.addScriptToEvaluateOnNewDocument', { source: `try{localStorage.setItem('ara.studio.tour.v1','1')}catch{}` });

            console.log('▶ A navegar para o Studio...');
            await send('Page.navigate', { url: 'http://localhost:4422/studio/#demo' });
            await waitFor('window.studio?.ready', 'Studio carregado', 180000);
            console.log('✅ Studio pronto.');

            // Carregar a cena gerada
            const projectJSON = JSON.stringify(sceneProject);
            await evaluate(`(async () => {
              const project = ${projectJSON};
              await window.studio.setProject(project);
            })()`);
            await waitFor('window.studio?.ready', 'Cena carregada', 60000);
            console.log('✅ Cena carregada no Studio.');
            await pause(1000);

            // Exportar MP4
            console.log(`▶ A exportar MP4 ${width}×${height}...`);
            const movieBase64 = await evaluate<string>(`(async () => {
              const scene = window.studio.scene;
              const project = window.studio.project;
              const blob = await window.studio.exportMovie(scene, project, {
                width: ${width},
                height: ${height},
                signal: new AbortController().signal,
                progress: (p) => { if (Math.round(p * 100) % 10 === 0) console.log('Export:', Math.round(p * 100) + '%'); }
              });
              return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(blob);
              });
            })()`);

            if (!movieBase64 || !movieBase64.startsWith('data:video/')) {
              throw new Error('exportMovie não devolveu um vídeo válido');
            }

            const mp4Data = Buffer.from(movieBase64.split(',')[1], 'base64');
            const outPath = join(OUTPUT_PATH, `AXEV_SCENE_${SCENE_ID}.mp4`);
            writeFileSync(outPath, mp4Data);
            console.log(`✅ MP4 exportado: ${outPath} (${Math.round(mp4Data.length / 1024)} KB)`);

            if (errors.length) {
              console.warn('⚠️ Erros de browser:', errors.join('\n'));
            }
          } catch (err) {
            console.error('❌ Erro ao exportar MP4:', err);
            await cleanup();
            process.exit(1);
          }

          await cleanup();
          console.log('✅ Exportação MP4 concluída.');
          TSEOF

          npx tsx export-scene-mp4.ts
          echo "✅ Script de exportação MP4 concluído."

      # ─── 8. PREPARAR OUTPUT FINAL ─────────────────────────────────────────
      - name: Preparar output
        run: |
          mkdir -p axev-output
          cp axev-build/scene.json axev-output/AXEV_SCENE.json 2>/dev/null || true

          DATA=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat > axev-output/AXEV_SCENE_REPORT.md << EOF
          # AXEV 3D — Relatório do Cenário

          ## Identificação
          - **ID**: ${{ inputs.scene_id }}
          - **Nome**: ${{ inputs.scene_name }}
          - **Run**: #${{ github.run_number }} | **Repo**: ${{ github.repository }}
          - **Data**: ${DATA}

          ## Configuração
          | Campo | Valor |
          |-------|-------|
          | Localização | ${{ inputs.location }} |
          | Duração | ${{ inputs.scene_duration }}s |
          | Personagem 1 | ${{ inputs.char1_preset }} · ${{ inputs.char1_action }} |
          | Personagem 2 | ${{ inputs.char2_preset }} |
          | Câmara | ${{ inputs.camera_framing }} · ${{ inputs.camera_angle }}° |
          | Música | ${{ inputs.music }} |
          | Export | ${{ inputs.export_format }} |

          ## Ficheiros produzidos
          - 🎬 \`AXEV_SCENE.json\` — abre directamente no Ara Studio
          - 📄 \`AXEV_SCENE_CATALOG.md\` — catálogo completo
          $([ "${{ inputs.export_format }}" = "json_glb_mp4" ] && echo "- 🧊 \`glb/AXEV_CHAR1.glb\` — modelo 3D personagem 1" || true)
          $([ "${{ inputs.export_format }}" = "json_glb_mp4" ] && [ "${{ inputs.char2_preset }}" != "none" ] && echo "- 🧊 \`glb/AXEV_CHAR2.glb\` — modelo 3D personagem 2" || true)
          $([ "${{ inputs.export_format }}" = "json_glb_mp4" ] && echo "- 🎥 \`AXEV_SCENE_${{ inputs.scene_id }}.mp4\` — vídeo ${{ inputs.mp4_resolution }}p" || true)

          ---
          *Gerado por AXEV 3D Studio — ara-axev-scene.yml*
          EOF

      # ─── 9. PUBLICAR ARTEFACTO ───────────────────────────────────────────
      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AXEV-SCENE-${{ inputs.scene_id }}
          path: axev-output/
          if-no-files-found: error
          retention-days: 14
