name: AXEV 3D — Gerar Veículo

on:
  workflow_dispatch:
    inputs:
      vehicle_id:
        description: "ID do veículo"
        required: true
        type: string
        default: "vehicle_001"
      vehicle_name:
        description: "Nome do veículo"
        required: true
        type: string
        default: "AXEV Vehicle"
      vehicle_type:
        description: "Tipo de veículo"
        required: true
        type: choice
        default: "sports_car"
        options:
          - "bicycle"
          - "car"
          - "sports_car"
          - "suv"
          - "pickup"
          - "motorcycle"
          - "horse"
          - "canoe"
          - "kayak"
          - "rowboat"
          - "motorboat"
          - "helicopter"
          - "tank"
          - "jet"
      color:
        description: "Cor da pintura (hex)"
        required: true
        type: choice
        default: "#c0392b"
        options:
          - "#c0392b"
          - "#1a1a1a"
          - "#f5f5f5"
          - "#2c3e50"
          - "#176a80"
          - "#27ae60"
          - "#e67e22"
          - "#8e44ad"
          - "#f1c40f"
          - "#7f8c8d"
          - "#2980b9"
          - "#6d4c41"
      finish:
        description: "Acabamento da pintura"
        required: true
        type: choice
        default: "gloss"
        options:
          - "gloss"
          - "matte"
      variant:
        description: "Variante do veículo"
        required: true
        type: choice
        default: "standard"
        options:
          - "standard"
          - "sport"
          - "offroad"
          - "military"
          - "luxury"
      with_rider:
        description: "Incluir rider"
        required: true
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"
      rider_preset:
        description: "Preset do rider"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Gangster"
          - "The Secret Agent"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "Detective"
          - "The Corporate High-Flier"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
      rider_gender_age:
        description: "Género e idade do rider"
        required: true
        type: choice
        default: "male:25"
        options:
          - "male:18"
          - "male:25"
          - "male:30"
          - "male:40"
          - "male:50"
          - "female:18"
          - "female:25"
          - "female:30"
          - "female:40"
      clips:
        description: "Animações a exportar"
        required: true
        type: choice
        default: "ride_only"
        options:
          - "ride_only"
          - "ride_board_alight"
          - "all_vehicle_clips"
      export_formats:
        description: "Formatos a exportar"
        required: true
        type: choice
        default: "glb"
        options:
          - "glb"
          - "fbx"
          - "glb,fbx"
      quality:
        description: "Qualidade do rider"
        required: true
        type: choice
        default: "high"
        options:
          - "low"
          - "medium"
          - "high"

permissions:
  contents: read

concurrency:
  group: axev-vehicle-${{ github.ref }}-${{ inputs.vehicle_id }}
  cancel-in-progress: false

jobs:
  generate-vehicle:
    name: "Gerar veículo"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validar inputs
        env:
          INPUT_VEHICLE_ID: ${{ inputs.vehicle_id }}
          INPUT_FORMATS: ${{ inputs.export_formats }}
          INPUT_COLOR: ${{ inputs.color }}
        run: |
          set -euo pipefail
          if ! echo "$INPUT_VEHICLE_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::vehicle_id inválido: '$INPUT_VEHICLE_ID'"
            exit 1
          fi
          if ! echo "$INPUT_COLOR" | grep -qE '^#[0-9a-fA-F]{6}$'; then
            echo "::error::Cor inválida: '$INPUT_COLOR'"
            exit 1
          fi
          FORMATS_NORM=$(echo "$INPUT_FORMATS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "FORMATS_NORM=$FORMATS_NORM" >> "$GITHUB_ENV"
          echo "Inputs validados. Formatos: $FORMATS_NORM"

      - name: Checkout AXEV
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clonar Ara 3D Gen
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      - name: Instalar dependências
        working-directory: ara-3d-gen
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Cache assets MakeHuman
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            ara-3d-gen/vendor
            ara-3d-gen/public/assets
          key: ara3d-assets-v1-${{ hashFiles('ara-3d-gen/scripts/setup-assets.ts', 'ara-3d-gen/scripts/mocap-takes.ts') }}
          restore-keys: ara3d-assets-v1-

      - name: Preparar assets 3D
        working-directory: ara-3d-gen
        run: |
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ] || [ ! -d "vendor/sys/skins" ]; then
            npm run setup-assets
          else
            echo "Assets em cache."
          fi

      - name: Construir parâmetros do rider
        env:
          INPUT_WITH_RIDER: ${{ inputs.with_rider }}
          INPUT_RIDER_PRESET: ${{ inputs.rider_preset }}
          INPUT_RIDER_GENDER_AGE: ${{ inputs.rider_gender_age }}
          INPUT_QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p axev-build
          WITH_RIDER="$INPUT_WITH_RIDER"
          PRESET="$INPUT_RIDER_PRESET"
          GA="$INPUT_RIDER_GENDER_AGE"
          QUALITY="$INPUT_QUALITY"
          GENDER=$(echo "$GA" | cut -d: -f1)
          AGE=$(echo "$GA" | cut -d: -f2)
          if [ "$GENDER" = "female" ]; then
            GENDER_VAL="0.0"
          else
            GENDER_VAL="1.0"
          fi
          AGE_VAL=$(python3 -c "
          y = max(12, min(90, int('$AGE')))
          v = round(0.5 + ((y-25)/65)*0.5 if y >= 25 else 0.5, 4)
          print(v)
          ")
          cat > axev-build/rider.params.json << JSONEOF
          {
            "name": "$PRESET",
            "detail": "$QUALITY",
            "animations": true,
            "rig": "game",
            "restPose": "A",
            "faceShapes": false,
            "speechShapes": false,
            "stageProps": false,
            "gender": $GENDER_VAL,
            "age": $AGE_VAL
          }
          JSONEOF
          echo "Parâmetros do rider gerados."
          cat axev-build/rider.params.json

      - name: Gerar veículo com Ara 3D Gen
        working-directory: ara-3d-gen
        env:
          FORMATS_NORM: ${{ env.FORMATS_NORM }}
          VEHICLE_TYPE: ${{ inputs.vehicle_type }}
          VEHICLE_COLOR: ${{ inputs.color }}
          VEHICLE_FINISH: ${{ inputs.finish }}
          VEHICLE_VARIANT: ${{ inputs.variant }}
          WITH_RIDER: ${{ inputs.with_rider }}
        run: |
          set -euo pipefail
          mkdir -p out/vehicles
          echo "A gerar veículo: $VEHICLE_TYPE | cor: $VEHICLE_COLOR | formatos: $FORMATS_NORM"
          npx tsx ../ara-vehicle-export-cli.ts \
            --vehicle "$VEHICLE_TYPE" \
            --color "$VEHICLE_COLOR" \
            --finish "$VEHICLE_FINISH" \
            --variant "$VEHICLE_VARIANT" \
            --with-rider "$WITH_RIDER" \
            --rider-params ../axev-build/rider.params.json \
            --formats "$FORMATS_NORM" \
            --out out/vehicles \
            2>&1 | tee ../axev-build/engine_output.log
          echo "Ficheiros produzidos:"
          find out/vehicles -type f | sort | while IFS= read -r f; do
            echo "  $f ($(du -h "$f" | cut -f1))"
          done

      - name: Validar ficheiros exportados
        run: |
          set -euo pipefail
          OUT="ara-3d-gen/out/vehicles"
          if [ ! -d "$OUT" ] || [ -z "$(find "$OUT" -type f -print -quit)" ]; then
            echo "::error::Nenhum ficheiro exportado em $OUT"
            exit 1
          fi
          while IFS= read -r f; do
            SIZE=$(stat -c%s "$f")
            SIZE_KB=$(( SIZE / 1024 ))
            echo "$f (${SIZE_KB} KB)"
            if [ "$SIZE" -lt 100 ]; then
              echo "::warning::Ficheiro suspeito muito pequeno: $f"
            fi
          done < <(find "$OUT" -type f | sort)

      - name: Preparar e publicar artefacto
        run: |
          mkdir -p axev-output/exports
          cp -r ara-3d-gen/out/vehicles/. axev-output/exports/ 2>/dev/null || true
          cp axev-build/rider.params.json axev-output/AXEV_RIDER_PARAMS.json 2>/dev/null || true
          cp axev-build/engine_output.log axev-output/AXEV_ENGINE_OUTPUT.log 2>/dev/null || true

      - name: Upload artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AXEV-VEHICLE-${{ inputs.vehicle_id }}
          path: axev-output/
          if-no-files-found: error
          retention-days: 14
