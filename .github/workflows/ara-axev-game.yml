name: AXEV 3D — Gerar Jogo

on:
  workflow_dispatch:
    inputs:

      # 1
      game_id:
        description: "ID do jogo"
        required: true
        type: string
        default: "game_001"

      # 2
      game_title:
        description: "Título do jogo"
        required: true
        type: string
        default: "AXEV Mission"

      # 3
      game_mode:
        description: "Modo de jogo"
        required: true
        type: choice
        default: "mission"
        options:
          - "mission"
          - "arcade_race"
          - "endless_runner"

      # ════════════ MISSÃO ════════════

      # 4
      mission_location:
        description: "[MISSION] Localização"
        required: true
        type: choice
        default: "urban_block"
        options:
          - "urban_block"
          - "military_base"
          - "freight_depot"
          - "desert_compound"
          - "market_street"

      # 5
      mission_goal:
        description: "[MISSION] Objectivo"
        required: true
        type: choice
        default: "escape"
        options:
          - "escape"
          - "rescue"
          - "clear"

      # 6
      mission_extraction:
        description: "[MISSION] Extracção"
        required: true
        type: choice
        default: "on_foot"
        options:
          - "on_foot"
          - "pickup"
          - "helicopter"

      # 7
      mission_difficulty:
        description: "[MISSION] Dificuldade"
        required: true
        type: choice
        default: "normal"
        options:
          - "easy"
          - "normal"
          - "hard"

      # 8
      mission_time:
        description: "[MISSION] Hora do dia"
        required: true
        type: choice
        default: "day"
        options:
          - "dawn"
          - "day"
          - "dusk"
          - "night"

      # 9
      mission_weather:
        description: "[MISSION] Clima"
        required: true
        type: choice
        default: "clear"
        options:
          - "clear"
          - "rain"
          - "fog"
          - "sandstorm"

      # 10
      mission_stealth:
        description: "[MISSION] Modo stealth"
        required: true
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

      # ════════════ HERÓI ════════════

      # 11
      hero_preset:
        description: "Herói — Preset"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Gangster"
          - "The Secret Agent"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "Detective"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
          - "The Wasteland Survivor"

      # 12
      hero_gender_age:
        description: "Herói — Género:Idade"
        required: true
        type: choice
        default: "male:25"
        options:
          - "male:18"
          - "male:25"
          - "male:30"
          - "male:40"
          - "male:50"
          - "female:18"
          - "female:25"
          - "female:30"
          - "female:40"

      # 13
      hero_weapon:
        description: "Herói — Arma inicial"
        required: true
        type: choice
        default: "pistol"
        options:
          - "none"
          - "pistol"
          - "rifle"

      # ════════════ INIMIGOS ════════════

      # 14
      enemy_count:
        description: "Número de inimigos (1-5)"
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

      # 15
      enemy_role:
        description: "Papel dos inimigos"
        required: true
        type: choice
        default: "guard"
        options:
          - "guard"
          - "rifleman"
          - "heavy"
          - "squad_leader"
          - "elevated_sniper"
          - "mixed"

      # 16
      enemy_preset:
        description: "Inimigos — Preset visual"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "The Soldier"
          - "The African Warrior"
          - "The Gangster"
          - "The Bodyguard"
          - "Athletic man"

      # ════════════ ARCADE RACE ════════════

      # 17
      race_circuit:
        description: "[RACE] Circuito"
        required: true
        type: choice
        default: "city_loop"
        options:
          - "city_loop"
          - "desert_run"
          - "harbour_sprint"
          - "forest_ring"

      # 18
      race_laps:
        description: "[RACE] Número de voltas"
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "9"

      # 19
      race_car:
        description: "[RACE] Carro do jogador"
        required: true
        type: choice
        default: "sports_car"
        options:
          - "sports_car"
          - "muscle_car"
          - "saloon"
          - "go_kart"
          - "suv"
          - "pickup"
          - "motorcycle"
          - "danfo"
          - "van"

      # 20
      race_ai_skill:
        description: "[RACE] Dificuldade dos adversários"
        required: true
        type: choice
        default: "medium"
        options:
          - "easy"
          - "medium"
          - "hard"

      # ════════════ ENDLESS RUNNER ════════════

      # 21
      runner_theme:
        description: "[RUNNER] Tema do percurso"
        required: true
        type: choice
        default: "city_rooftops"
        options:
          - "temple_ruins"
          - "city_rooftops"
          - "desert_canyon"
          - "market_street"

      # 22
      runner_goal:
        description: "[RUNNER] Objectivo da run"
        required: true
        type: choice
        default: "distance"
        options:
          - "distance"
          - "score"
          - "coins"
          - "objects"

      # 23
      runner_chaser:
        description: "[RUNNER] Perseguidor"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "The Soldier"
          - "The African Warrior"
          - "The Gangster"
          - "The Bodyguard"
          - "Athletic man"

      # ════════════ ATMOSFERA ════════════

      # 24
      music:
        description: "Música de fundo"
        required: true
        type: choice
        default: "spy_mission"
        options:
          - "none"
          - "dramatic_adventure"
          - "spy_opening"
          - "spy_mission"
          - "urban_hip_hop"
          - "horror"
          - "afrobeat"
          - "jazz_restaurant"
          - "tropical_pop"
          - "old_school_salsa"

      # 25
      chapters:
        description: "Número de capítulos / etapas"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: axev-game-${{ github.ref }}-${{ inputs.game_id }}
  cancel-in-progress: false

jobs:
  generate-game:
    name: "Gerar jogo"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. VALIDAÇÃO ────────────────────────────────────────────────────
      - name: Validar inputs
        env:
          INPUT_GAME_ID:     ${{ inputs.game_id }}
          INPUT_ENEMY_COUNT: ${{ inputs.enemy_count }}
          INPUT_CHAPTERS:    ${{ inputs.chapters }}
        run: |
          set -euo pipefail
          if ! echo "$INPUT_GAME_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::game_id inválido: '$INPUT_GAME_ID'"
            exit 1
          fi
          if [ "$INPUT_ENEMY_COUNT" -gt 5 ] 2>/dev/null; then
            echo "::error::Máximo 5 inimigos."
            exit 1
          fi
          if [ "$INPUT_CHAPTERS" -gt 5 ] 2>/dev/null; then
            echo "::error::Máximo 5 capítulos."
            exit 1
          fi
          echo "✅ Inputs validados."

      # ─── 2. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout AXEV
        uses: actions/checkout@v4

      # ─── 3. CONSTRUIR JSON DO JOGO ────────────────────────────────────────
      - name: Construir JSON do jogo (Ara Play format)
        env:
          GAME_ID:            ${{ inputs.game_id }}
          GAME_TITLE:         ${{ inputs.game_title }}
          GAME_MODE:          ${{ inputs.game_mode }}
          MISSION_LOCATION:   ${{ inputs.mission_location }}
          MISSION_GOAL:       ${{ inputs.mission_goal }}
          MISSION_EXTRACTION: ${{ inputs.mission_extraction }}
          MISSION_DIFFICULTY: ${{ inputs.mission_difficulty }}
          MISSION_TIME:       ${{ inputs.mission_time }}
          MISSION_WEATHER:    ${{ inputs.mission_weather }}
          MISSION_STEALTH:    ${{ inputs.mission_stealth }}
          HERO_PRESET:        ${{ inputs.hero_preset }}
          HERO_GENDER_AGE:    ${{ inputs.hero_gender_age }}
          HERO_WEAPON:        ${{ inputs.hero_weapon }}
          ENEMY_COUNT:        ${{ inputs.enemy_count }}
          ENEMY_ROLE:         ${{ inputs.enemy_role }}
          ENEMY_PRESET:       ${{ inputs.enemy_preset }}
          RACE_CIRCUIT:       ${{ inputs.race_circuit }}
          RACE_LAPS:          ${{ inputs.race_laps }}
          RACE_CAR:           ${{ inputs.race_car }}
          RACE_AI_SKILL:      ${{ inputs.race_ai_skill }}
          RUNNER_THEME:       ${{ inputs.runner_theme }}
          RUNNER_GOAL:        ${{ inputs.runner_goal }}
          RUNNER_CHASER:      ${{ inputs.runner_chaser }}
          MUSIC:              ${{ inputs.music }}
          CHAPTERS:           ${{ inputs.chapters }}
          RUN_NUMBER:         ${{ github.run_number }}
          REPO:               ${{ github.repository }}
        run: |
          mkdir -p axev-build axev-output
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path

          def env(k, d=""): return os.environ.get(k, d).strip()

          game_id    = env("GAME_ID")
          game_title = env("GAME_TITLE")
          mode       = env("GAME_MODE", "mission")
          music_key  = env("MUSIC", "none")
          chapters   = int(env("CHAPTERS", "1"))
          run_number = env("RUN_NUMBER")
          repo       = env("REPO")

          MUSIC_IDS = {
            "dramatic_adventure": "dramatic-adventure-trailer",
            "spy_opening":        "spy-opening-scene",
            "spy_mission":        "spy-agent-mission-music",
            "urban_hip_hop":      "urban-hip-hop-beat",
            "horror":             "horror",
            "afrobeat":           "afrobeat-instrumental",
            "jazz_restaurant":    "jazz-restaurant-music",
            "tropical_pop":       "tropical-relaxing-pop",
            "old_school_salsa":   "old-school-salsa-02",
          }
          music_id = MUSIC_IDS.get(music_key)

          hero_ga = env("HERO_GENDER_AGE", "male:25").split(":")
          hero = {
            "preset": env("HERO_PRESET", "The Soldier"),
            "params": {
              "gender": 0.0 if hero_ga[0] == "female" else 1.0,
              "ageYears": int(hero_ga[1]) if len(hero_ga) > 1 else 25,
            },
            "weapon": env("HERO_WEAPON", "pistol"),
          }

          enemy_count  = int(env("ENEMY_COUNT", "3"))
          enemy_role   = env("ENEMY_ROLE", "guard")
          enemy_preset = env("ENEMY_PRESET", "The Soldier")

          ROLE_MAP = {
            "guard": "guard", "rifleman": "rifleman", "heavy": "heavy",
            "squad_leader": "squad_leader", "elevated_sniper": "elevated_sniper",
          }

          def make_enemy(i):
            if enemy_role == "mixed":
              role = ["guard", "rifleman", "squad_leader"][i % 3]
            else:
              role = ROLE_MAP.get(enemy_role, "guard")
            return {
              "id": f"enemy_{i+1}", "preset": enemy_preset, "role": role,
              "weapon": "rifle" if role in ("rifleman", "elevated_sniper", "heavy", "squad_leader") else "pistol",
            }

          enemies = [make_enemy(i) for i in range(enemy_count)]

          def make_chapter(idx):
            ch = {
              "id": f"chapter_{idx+1}",
              "title": f"{game_title} — Chapter {idx+1}" if chapters > 1 else game_title,
            }
            if mode == "mission":
              ch.update({
                "location": env("MISSION_LOCATION", "urban_block"),
                "goal": env("MISSION_GOAL", "escape"),
                "extraction": env("MISSION_EXTRACTION", "on_foot"),
                "difficulty": env("MISSION_DIFFICULTY", "normal"),
                "stealth": env("MISSION_STEALTH", "false") == "true",
                "environment": {"time": env("MISSION_TIME", "day"), "weather": env("MISSION_WEATHER", "clear")},
                "cast": {"hero": hero, "enemies": enemies},
              })
            elif mode == "arcade_race":
              ch.update({
                "mode": "race",
                "race": {
                  "circuit":   env("RACE_CIRCUIT", "city_loop"),
                  "laps":      int(env("RACE_LAPS", "3")),
                  "opponents": 5,          # default fixo (removido do input)
                  "car":       env("RACE_CAR", "sports_car"),
                  "handling":  "grip",     # default fixo (removido do input)
                  "aiSkill":   env("RACE_AI_SKILL", "medium"),
                  "rubberBand": True, "nitro": True, "pickups": True, "ghost": True,
                },
                "cast": {"hero": hero, "enemies": enemies},
              })
            elif mode == "endless_runner":
              ch.update({
                "mode": "runner",
                "runner": {
                  "theme": env("RUNNER_THEME", "city_rooftops"),
                  "goal":  {"type": env("RUNNER_GOAL", "distance")},
                  "medals": {"bronze": 1500, "silver": 4000, "gold": 8000},
                },
                "cast": {"hero": hero, "chaser": {"preset": env("RUNNER_CHASER", "The Soldier")}},
              })
            if music_id:
              ch["music"] = {"id": music_id, "volume": 0.75}
            return ch

          game_json = {
            "kind": "ara-play", "version": 1,
            "mode": "mission" if mode == "mission" else ("race" if mode == "arcade_race" else "runner"),
            "meta": {"id": game_id, "title": game_title, "run": int(run_number) if run_number else 0, "repo": repo},
            "title": game_title,
            "chapters": [make_chapter(i) for i in range(chapters)],
            "poses": {"lookAround": True, "dance": True},
          }

          out = Path("axev-build/game.json")
          out.write_text(json.dumps(game_json, indent=2, ensure_ascii=False))
          print(f"✅ JSON do jogo gerado: {out}")
          print(f"   Modo: {mode} | Capítulos: {chapters} | Herói: {hero['preset']} | Inimigos: {enemy_count}x {enemy_role}")
          PYEOF

      # ─── 4. GERAR CATÁLOGO ───────────────────────────────────────────────
      - name: Gerar catálogo do jogo
        env:
          GAME_ID:            ${{ inputs.game_id }}
          GAME_TITLE:         ${{ inputs.game_title }}
          GAME_MODE:          ${{ inputs.game_mode }}
          MISSION_LOCATION:   ${{ inputs.mission_location }}
          MISSION_GOAL:       ${{ inputs.mission_goal }}
          MISSION_EXTRACTION: ${{ inputs.mission_extraction }}
          MISSION_DIFFICULTY: ${{ inputs.mission_difficulty }}
          MISSION_TIME:       ${{ inputs.mission_time }}
          MISSION_WEATHER:    ${{ inputs.mission_weather }}
          MISSION_STEALTH:    ${{ inputs.mission_stealth }}
          HERO_PRESET:        ${{ inputs.hero_preset }}
          HERO_GENDER_AGE:    ${{ inputs.hero_gender_age }}
          HERO_WEAPON:        ${{ inputs.hero_weapon }}
          ENEMY_COUNT:        ${{ inputs.enemy_count }}
          ENEMY_ROLE:         ${{ inputs.enemy_role }}
          ENEMY_PRESET:       ${{ inputs.enemy_preset }}
          RACE_CIRCUIT:       ${{ inputs.race_circuit }}
          RACE_LAPS:          ${{ inputs.race_laps }}
          RACE_CAR:           ${{ inputs.race_car }}
          RACE_AI_SKILL:      ${{ inputs.race_ai_skill }}
          RUNNER_THEME:       ${{ inputs.runner_theme }}
          RUNNER_GOAL:        ${{ inputs.runner_goal }}
          RUNNER_CHASER:      ${{ inputs.runner_chaser }}
          MUSIC:              ${{ inputs.music }}
          CHAPTERS:           ${{ inputs.chapters }}
          RUN_NUMBER:         ${{ github.run_number }}
          REPO:               ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          def env(k, d=""): return os.environ.get(k, d).strip()

          game_id  = env("GAME_ID"); game_title = env("GAME_TITLE")
          mode     = env("GAME_MODE", "mission"); chapters = env("CHAPTERS", "1")
          run_number = env("RUN_NUMBER"); repo = env("REPO")
          gen_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          game_path = Path("axev-build/game.json")
          game_data = json.loads(game_path.read_text())
          game_hash = hashlib.sha256(game_path.read_bytes()).hexdigest()[:16] + "…"

          md = f"""# AXEV Game Catalog
          ## Identificação
          | Campo | Valor |
          |---|---|
          | id | `{game_id}` |
          | título | {game_title} |
          | modo | {mode} |
          | capítulos | {chapters} |
          | run | #{run_number} |
          | hash | `{game_hash}` |
          | data | {gen_date} |

          ## Configuração
          | Campo | Valor |
          |---|---|
          | herói | {env("HERO_PRESET")} ({env("HERO_GENDER_AGE")}) arma={env("HERO_WEAPON")} |
          | inimigos | {env("ENEMY_COUNT")}x {env("ENEMY_ROLE")} preset={env("ENEMY_PRESET")} |
          | música | {env("MUSIC")} |
          | localização | {env("MISSION_LOCATION")} |
          | objectivo | {env("MISSION_GOAL")} |
          | dificuldade | {env("MISSION_DIFFICULTY")} |
          | hora/clima | {env("MISSION_TIME")} / {env("MISSION_WEATHER")} |
          | stealth | {env("MISSION_STEALTH")} |
          | circuito | {env("RACE_CIRCUIT")} laps={env("RACE_LAPS")} car={env("RACE_CAR")} ai={env("RACE_AI_SKILL")} |
          | runner | {env("RUNNER_THEME")} goal={env("RUNNER_GOAL")} chaser={env("RUNNER_CHASER")} |

          ## JSON completo
          ```json
          {json.dumps(game_data, indent=2, ensure_ascii=False)}
          ```
          *Pipeline: ara-axev-game.yml · Run #{run_number} · {gen_date}*
          """

          out = Path("axev-output/AXEV_GAME_CATALOG.md")
          out.write_text(md, encoding="utf-8")
          print(f"✅ Catálogo gerado: {out}")
          PYEOF

      # ─── 5. PREPARAR OUTPUT ───────────────────────────────────────────────
      - name: Preparar output
        env:
          GAME_ID:    ${{ inputs.game_id }}
          GAME_TITLE: ${{ inputs.game_title }}
          GAME_MODE:  ${{ inputs.game_mode }}
          CHAPTERS:   ${{ inputs.chapters }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO:       ${{ github.repository }}
        run: |
          mkdir -p axev-output
          cp axev-build/game.json axev-output/AXEV_GAME.json
          DATA=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat > axev-output/AXEV_GAME_REPORT.md << EOF
          # AXEV 3D — Relatório do Jogo
          - **ID**: ${GAME_ID} | **Título**: ${GAME_TITLE} | **Modo**: ${GAME_MODE}
          - **Capítulos**: ${CHAPTERS} | **Run**: #${RUN_NUMBER} | **Data**: ${DATA}

          ## Como usar
          1. Abre **[ara3dgen.com/play](https://ara3dgen.com/play/)**
          2. Clica **LLM Assist → Open setup**
          3. Carrega **AXEV_GAME.json**
          4. Clica **Game preparation** → preview imediato
          EOF

      # ─── 6. PUBLICAR ARTEFACTO ───────────────────────────────────────────
      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AXEV-GAME-${{ inputs.game_id }}
          path: axev-output/
          if-no-files-found: error
          retention-days: 14
