name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -Lo gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v9.3.1/gradle/wrapper/gradle-wrapper.jar

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create .env file with secrets
        run: echo "GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" > .env

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: axev3d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
