name: AXEV 3D — Gerar Personagem

on:
  workflow_dispatch:
    inputs:

      # 1
      character_name:
        description: "Nome do personagem"
        required: true
        type: string
        default: "AXEV Character"

      # 2
      preset:
        description: "Preset base"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Yoruba Warrior"
          - "The Maasai Warrior"
          - "The Zulu Warrior"
          - "The Dahomey Warrior"
          - "The American Sheriff"
          - "The Police Officer (Nigeria)"
          - "The FRSC Officer (Nigeria)"
          - "Detective"
          - "The Secret Agent"
          - "The Covert Spy"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "The Gangster"
          - "The Prison Escapee"
          - "The Priest"
          - "The Corporate High-Flier"
          - "The Female Executive"
          - "Businesswoman"
          - "The Arabian Oil Tycoon"
          - "The Miami Dealer"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
          - "The Wasteland Survivor"
          - "The Bride"
          - "The Beach Girl"
          - "Heavy brute"
          - "Elder"
          - "Teen"

      # 3
      gender_age:
        description: "Género e idade (género:idade)"
        required: true
        type: choice
        default: "male:25"
        options:
          - "male:18"
          - "male:25"
          - "male:30"
          - "male:40"
          - "male:50"
          - "male:60"
          - "male:70"
          - "female:18"
          - "female:25"
          - "female:30"
          - "female:40"
          - "female:50"
          - "female:60"
          - "androgynous:25"
          - "androgynous:30"

      # 4
      body:
        description: "Corpo (musculatura:peso:altura)"
        required: true
        type: choice
        default: "medium:average:average"
        options:
          - "slim:very slim:short"
          - "slim:slim:average"
          - "medium:average:average"
          - "athletic:average:tall"
          - "athletic:slim:average"
          - "muscular:average:tall"
          - "muscular:heavy:tall"
          - "very muscular:heavy:very tall"
          - "medium:heavy:average"
          - "medium:very heavy:short"
          - "none:slim:very short"

      # 5
      skin_tone:
        description: "Tom de pele"
        required: true
        type: choice
        default: "mixed"
        options:
          - "very light"
          - "light"
          - "mixed"
          - "dark"
          - "very dark"
          - "african"
          - "asian"
          - "caucasian"

      # 6
      hair:
        description: "Cabelo (estilo:cor)"
        required: true
        type: choice
        default: "short02:black"
        options:
          - "none:black"
          - "buzz:black"
          - "buzz:brown"
          - "short02:black"
          - "short02:brown"
          - "short02:blonde"
          - "short02:grey"
          - "short04:black"
          - "short04:brown"
          - "long01:black"
          - "long01:brown"
          - "long01:blonde"
          - "long01:red"
          - "long01:purple"
          - "bob02:black"
          - "bob02:brown"
          - "afro01:black"
          - "cornrows:black"
          - "box_braids:black"
          - "ponytail01:black"
          - "ponytail01:brown"
          - "braid01:black"
          - "mohawk:black"
          - "mohawk:purple"

      # 7
      facial_hair:
        description: "Pelo facial"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "stubble"
          - "mustache"
          - "mustache_stubble"
          - "goatee"
          - "short_beard"
          - "full_beard"

      # 8
      eyes:
        description: "Cor dos olhos"
        required: true
        type: choice
        default: "brown"
        options:
          - "blackbrown"
          - "darkbrown"
          - "brown"
          - "brownlight"
          - "green"
          - "lightblue"
          - "grey"
          - "ice"

      # 9
      outfit:
        description: "Roupa"
        required: true
        type: choice
        default: "preset_default"
        options:
          - "preset_default"
          - "male_casualsuit01"
          - "male_elegantsuit01"
          - "male_worksuit01"
          - "female_casualsuit02"
          - "female_elegantsuit01"
          - "female_sportsuit01"
          - "set_suit_tie"
          - "set_wedding_gown"
          - "set_cocktail_dress"
          - "set_pantsuit"
          - "set_prison_jumpsuit"
          - "set_street_tee_jeans"
          - "set_clergy"
          - "set_thobe"
          - "fatigue_shirt+fatigue_pants"
          - "uniform_shirt+uniform_trousers"
          - "tank_top+cargo_shorts"
          - "techwear_jacket+techwear_pants"
          - "none"

      # 10
      shoes_hat:
        description: "Calçado:Chapéu"
        required: true
        type: choice
        default: "preset_default:none"
        options:
          - "preset_default:none"
          - "combat_boots:none"
          - "combat_boots:helmet"
          - "combat_boots:beret"
          - "sneakers:baseball_cap"
          - "sneakers:none"
          - "oxfords:none"
          - "oxfords:fedora01"
          - "shoes01:none"
          - "shoes02:none"
          - "heels:none"
          - "sandals:none"
          - "none:cowboy_hat"
          - "shoes03:cowboy_hat"

      # 11
      weapon:
        description: "Arma"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "pistol"
          - "rifle"
          - "shotgun"
          - "smg"
          - "knife"
          - "sword"
          - "axe"
          - "bat"

      # 12
      expression:
        description: "Expressão facial"
        required: true
        type: choice
        default: "neutral"
        options:
          - "neutral"
          - "happy"
          - "angry"
          - "determined"
          - "sad"
          - "surprised"
          - "afraid"

      # 13
      rig_anim:
        description: "Rig:Animações:Pose"
        required: true
        type: choice
        default: "game:yes:A"
        options:
          - "game:yes:A"
          - "game:yes:T"
          - "game:no:A"
          - "game:no:T"
          - "game_lite:yes:A"
          - "game_lite:yes:T"
          - "full:yes:A"
          - "full:yes:T"
          - "none:no:A"

      # 14
      quality:
        description: "Qualidade"
        required: true
        type: choice
        default: "high"
        options:
          - "low"
          - "medium"
          - "high"

      # 15
      export_formats:
        description: "Formatos a exportar"
        required: true
        type: choice
        default: "glb"
        options:
          - "glb"
          - "fbx"
          - "obj"
          - "zip"
          - "glb,fbx"
          - "glb,obj"
          - "glb,fbx,obj"
          - "glb,fbx,obj,zip"

      # 16
      character_id:
        description: "ID do personagem (gerado pela app)"
        required: true
        type: string
        default: "character_001"

      # 17
      config_json:
        description: "JSON do CharacterConfig da app (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: axev-character-${{ github.ref }}-${{ inputs.character_id }}
  cancel-in-progress: false

jobs:
  generate-character:
    name: "Gerar personagem"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. VALIDAÇÃO ────────────────────────────────────────────────────
      - name: Validar inputs
        env:
          INPUT_FORMATS: ${{ inputs.export_formats }}
          INPUT_ID:      ${{ inputs.character_id }}
          INPUT_JSON:    ${{ inputs.config_json }}
        run: |
          set -euo pipefail

          if ! echo "$INPUT_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::character_id inválido: '$INPUT_ID'"
            exit 1
          fi

          ALLOWED="glb fbx obj zip"
          IFS=',' read -ra FMTS <<< "$INPUT_FORMATS"
          for fmt in "${FMTS[@]}"; do
            fmt_clean=$(echo "$fmt" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if ! echo "$ALLOWED" | grep -qw "$fmt_clean"; then
              echo "::error::Formato não suportado: '$fmt_clean'"
              exit 1
            fi
          done
          FORMATS_NORM=$(echo "$INPUT_FORMATS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "FORMATS_NORM=$FORMATS_NORM" >> "$GITHUB_ENV"

          if [ -n "$INPUT_JSON" ]; then
            if ! echo "$INPUT_JSON" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              echo "::error::config_json contém JSON malformado."
              exit 1
            fi
          fi
          echo "✅ Inputs validados. Formatos: $FORMATS_NORM"

      # ─── 2. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout AXEV
        uses: actions/checkout@v4

      # ─── 3. NODE.JS ──────────────────────────────────────────────────────
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ─── 4. CLONAR MOTOR ─────────────────────────────────────────────────
      - name: Clonar Ara 3D Gen
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      # ─── 5. DEPENDÊNCIAS ─────────────────────────────────────────────────
      - name: Instalar dependências
        working-directory: ara-3d-gen
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # ─── 6. CACHE ASSETS ─────────────────────────────────────────────────
      - name: Cache assets MakeHuman
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            ara-3d-gen/vendor
            ara-3d-gen/public/assets
          key: ara3d-assets-v1-${{ hashFiles('ara-3d-gen/scripts/setup-assets.ts', 'ara-3d-gen/scripts/mocap-takes.ts') }}
          restore-keys: ara3d-assets-v1-

      - name: Preparar assets 3D
        working-directory: ara-3d-gen
        run: |
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ] || [ ! -d "vendor/sys/skins" ]; then
            echo "A descarregar assets MakeHuman (~280 MB)..."
            npm run setup-assets
          else
            echo "✅ Assets em cache."
          fi

      # ─── 7. CONSTRUIR PARÂMETROS ──────────────────────────────────────────
      - name: Construir parâmetros do personagem
        env:
          INPUT_PRESET:      ${{ inputs.preset }}
          INPUT_NAME:        ${{ inputs.character_name }}
          INPUT_GENDER_AGE:  ${{ inputs.gender_age }}
          INPUT_BODY:        ${{ inputs.body }}
          INPUT_SKIN:        ${{ inputs.skin_tone }}
          INPUT_HAIR:        ${{ inputs.hair }}
          INPUT_FACIAL_HAIR: ${{ inputs.facial_hair }}
          INPUT_EYES:        ${{ inputs.eyes }}
          INPUT_OUTFIT:      ${{ inputs.outfit }}
          INPUT_SHOES_HAT:   ${{ inputs.shoes_hat }}
          INPUT_WEAPON:      ${{ inputs.weapon }}
          INPUT_EXPRESSION:  ${{ inputs.expression }}
          INPUT_RIG_ANIM:    ${{ inputs.rig_anim }}
          INPUT_QUALITY:     ${{ inputs.quality }}
          INPUT_JSON:        ${{ inputs.config_json }}
        run: |
          mkdir -p axev-build
          python3 << 'PYEOF'
          import json, os

          def env(k, d=""): return os.environ.get(k, d).strip()

          preset = env("INPUT_PRESET", "Athletic man")
          params = {
            "name": env("INPUT_NAME", preset) or preset,
            "detail": env("INPUT_QUALITY", "high").lower(),
          }

          ga = env("INPUT_GENDER_AGE", "male:25").split(":")
          gender_str = ga[0] if len(ga) > 0 else "male"
          age_str    = ga[1] if len(ga) > 1 else "25"
          params["gender"] = 0.0 if gender_str == "female" else (0.5 if gender_str == "androgynous" else 1.0)
          try:
            y = max(12, min(90, int(age_str)))
            params["age"] = round(0.5 + ((y-25)/65)*0.5 if y >= 25 else 0.1875 + ((y-11)/14)*0.3125 if y >= 11 else (y/11)*0.1875, 4)
          except: pass

          muscle_map = {"none":0.1,"slim":0.3,"medium":0.5,"athletic":0.7,"muscular":0.85,"very muscular":1.0}
          weight_map = {"very slim":0.15,"slim":0.3,"average":0.5,"heavy":0.7,"very heavy":0.9}
          height_map = {"very short":0.1,"short":0.3,"average":0.5,"tall":0.7,"very tall":0.9}
          body_parts = env("INPUT_BODY", "medium:average:average").split(":")
          if len(body_parts) >= 1: params["muscle"] = muscle_map.get(body_parts[0], 0.5)
          if len(body_parts) >= 2: params["weight"] = weight_map.get(body_parts[1], 0.5)
          if len(body_parts) >= 3: params["height"] = height_map.get(body_parts[2], 0.5)

          skin_map = {
            "very light":{"african":0.0,"asian":0.05,"caucasian":0.95},
            "light":     {"african":0.0,"asian":0.1, "caucasian":0.9},
            "mixed":     {"african":0.3,"asian":0.2, "caucasian":0.5},
            "dark":      {"african":0.7,"asian":0.1, "caucasian":0.2},
            "very dark": {"african":0.9,"asian":0.05,"caucasian":0.05},
            "african":   {"african":1.0,"asian":0.0, "caucasian":0.0},
            "asian":     {"african":0.0,"asian":1.0, "caucasian":0.0},
            "caucasian": {"african":0.0,"asian":0.0, "caucasian":1.0},
          }
          params.update(skin_map.get(env("INPUT_SKIN","mixed"), {"african":0.3,"asian":0.2,"caucasian":0.5}))

          hair_parts = env("INPUT_HAIR","short02:black").split(":")
          hair_style = hair_parts[0] if len(hair_parts) > 0 else "short02"
          hair_color = hair_parts[1] if len(hair_parts) > 1 else "black"
          if hair_style != "preset_default": params["hair"] = hair_style
          color_map = {"black":"#15100c","dark brown":"#241a13","brown":"#3b2a1d","blonde":"#c8a86b",
                       "red":"#7a2e14","grey":"#6a6060","white":"#c8c0b4","purple":"#4a1a6a","blue":"#1a2a6a","pink":"#c060a0"}
          hc = color_map.get(hair_color)
          if hc: params["hairColor"] = hc

          fh = env("INPUT_FACIAL_HAIR","none")
          if fh != "preset_default": params["facialHair"] = fh

          params["eyes"] = env("INPUT_EYES","brown")
          params["expression"] = env("INPUT_EXPRESSION","neutral")

          w = env("INPUT_WEAPON","none")
          if w not in ("preset_default",""): params["weapon"] = w

          outfit = env("INPUT_OUTFIT","preset_default")
          if outfit == "preset_default":
            pass
          elif "+" in outfit:
            top, bottom = outfit.split("+", 1)
            params["outfit"] = "none"
            params["top"] = top
            params["bottom"] = bottom
          elif outfit == "none":
            params["outfit"] = "none"
          else:
            params["outfit"] = outfit

          sh = env("INPUT_SHOES_HAT","preset_default:none").split(":")
          shoes = sh[0] if len(sh) > 0 else "preset_default"
          hat   = sh[1] if len(sh) > 1 else "none"
          if shoes not in ("preset_default",""): params["shoes"] = shoes
          if hat   not in ("preset_default",""): params["hat"] = hat

          ra = env("INPUT_RIG_ANIM","game:yes:A").split(":")
          params["rig"]        = ra[0] if len(ra) > 0 else "game"
          params["animations"] = (ra[1] if len(ra) > 1 else "yes") == "yes"
          params["restPose"]   = ra[2] if len(ra) > 2 else "A"
          params["faceShapes"]   = True
          params["speechShapes"] = True
          params["faceBones"]    = True

          with open("axev-build/character_overrides.json","w") as f:
            json.dump(params, f, indent=2)
          print("✅ Parâmetros prontos:")
          print(json.dumps(params, indent=2))
          PYEOF

      # ─── 8. GERAR PERSONAGEM ──────────────────────────────────────────────
      - name: Gerar personagem com Ara 3D Gen
        working-directory: ara-3d-gen
        env:
          FORMATS_NORM:    ${{ env.FORMATS_NORM }}
          RESOLVED_PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          mkdir -p out

          cat > merge-params.ts << 'TSEOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { DEFAULT_PARAMS, PRESETS } from './src/core/params';

          const presetName = process.env.RESOLVED_PRESET ?? 'Athletic man';
          const preset = (PRESETS as Record<string, object>)[presetName] ?? {};
          const overrides = JSON.parse(readFileSync('../axev-build/character_overrides.json', 'utf8'));
          const final = { ...DEFAULT_PARAMS, ...preset, ...overrides };
          writeFileSync('../axev-build/character.params.json', JSON.stringify(final, null, 2));
          console.log(`✅ Preset "${presetName}" + ${Object.keys(overrides).length} overrides combinados.`);
          TSEOF

          npx tsx merge-params.ts

          echo "A gerar com formatos: $FORMATS_NORM"
          # Capturar stdout do motor — contém: height, tris, materials, build time
          npm run export -- \
            --params "../axev-build/character.params.json" \
            --formats "$FORMATS_NORM" \
            --out out 2>&1 | tee ../axev-build/engine_output.log

          echo "✅ Geração concluída."
          find out -type f -printf '  %p (%s bytes)\n'

      # ─── 8b. GERAR CATÁLOGO DO PERSONAGEM (DADOS BRUTOS DO MOTOR) ─────────
      - name: Gerar catálogo do personagem
        env:
          CHARACTER_ID:   ${{ inputs.character_id }}
          CHARACTER_NAME: ${{ inputs.character_name }}
          PRESET:         ${{ inputs.preset }}
          GENDER_AGE:     ${{ inputs.gender_age }}
          BODY:           ${{ inputs.body }}
          SKIN:           ${{ inputs.skin_tone }}
          HAIR:           ${{ inputs.hair }}
          FACIAL_HAIR:    ${{ inputs.facial_hair }}
          EYES:           ${{ inputs.eyes }}
          OUTFIT:         ${{ inputs.outfit }}
          SHOES_HAT:      ${{ inputs.shoes_hat }}
          WEAPON:         ${{ inputs.weapon }}
          EXPRESSION:     ${{ inputs.expression }}
          RIG_ANIM:       ${{ inputs.rig_anim }}
          QUALITY:        ${{ inputs.quality }}
          FORMATS_NORM:   ${{ env.FORMATS_NORM }}
          RUN_NUMBER:     ${{ github.run_number }}
          REPO:           ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p axev-output

          python3 << 'PYEOF'
          import os, json, hashlib, re
          from pathlib import Path
          from datetime import datetime, timezone

          def env(k, d=""): return os.environ.get(k, d).strip()

          # ── Dados de inputs ──────────────────────────────────────────────
          char_id     = env("CHARACTER_ID")
          char_name   = env("CHARACTER_NAME")
          preset      = env("PRESET")
          gender_age  = env("GENDER_AGE")
          body        = env("BODY")
          skin        = env("SKIN")
          hair        = env("HAIR")
          facial_hair = env("FACIAL_HAIR")
          eyes        = env("EYES")
          outfit      = env("OUTFIT")
          shoes_hat   = env("SHOES_HAT")
          weapon      = env("WEAPON")
          expression  = env("EXPRESSION")
          rig_anim    = env("RIG_ANIM")
          quality     = env("QUALITY")
          formats     = env("FORMATS_NORM")
          run_number  = env("RUN_NUMBER")
          repo        = env("REPO")
          gen_date    = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          # ── Ler parâmetros finais ────────────────────────────────────────
          params_path = Path("axev-build/character.params.json")
          params = json.loads(params_path.read_text()) if params_path.exists() else {}

          # ── Parsear stdout do motor ──────────────────────────────────────
          # Linha: "Name: 185 cm, 42300 tris, 8 materials, built in 4320 ms"
          engine_log = Path("axev-build/engine_output.log").read_text() if Path("axev-build/engine_output.log").exists() else ""
          height_cm = tris = materials_count = build_ms = "N/D"
          m = re.search(r'(\d+)\s*cm,\s*(\d[\d,]*)\s*tris?,\s*(\d+)\s*materials?,\s*built in\s*(\d+)\s*ms', engine_log)
          if m:
              height_cm      = m.group(1) + " cm"
              tris           = m.group(2).replace(",", "")
              materials_count = m.group(3)
              build_ms       = m.group(4) + " ms"

          # ── Inventário de ficheiros produzidos ───────────────────────────
          out_dir = Path("ara-3d-gen/out")
          files_info = []
          glb_hash = "N/D"
          for f in sorted(out_dir.rglob("*")) if out_dir.exists() else []:
              if f.is_file():
                  size_kb = f.stat().st_size // 1024
                  files_info.append(f"| {f.name} | {f.suffix.lstrip('.')} | {size_kb} KB |")
                  if f.suffix == ".glb" and glb_hash == "N/D":
                      h = hashlib.sha256(f.read_bytes()).hexdigest()
                      glb_hash = h[:16] + "…"

          files_table = "\n".join(files_info) if files_info else "| (nenhum) | - | - |"

          # ── Detalhe do rig/anim ──────────────────────────────────────────
          ra = rig_anim.split(":")
          rig_type   = ra[0] if len(ra) > 0 else "game"
          has_anim   = (ra[1] if len(ra) > 1 else "yes") == "yes"
          rest_pose  = ra[2] if len(ra) > 2 else "A"
          face_shapes   = params.get("faceShapes", True)
          speech_shapes = params.get("speechShapes", True)
          face_bones    = params.get("faceBones", True)

          # ── Montar MD ────────────────────────────────────────────────────
          md = f"""# AXEV Character Catalog
          <!-- Gerado automaticamente pelo pipeline ara-axev-crime.yml — NÃO editar manualmente -->

          ## 1. IDENTIFICAÇÃO E VERSÃO

          | Campo | Valor |
          |---|---|
          | id | `{char_id}` |
          | nome | {char_name} |
          | preset | {preset} |
          | pipeline_version | ara-axev-crime.yml · run #{run_number} |
          | repo | {repo} |
          | hash_glb (SHA-256 parcial) | `{glb_hash}` |
          | data_geracao | {gen_date} |
          | motor | Ara 3D Gen (olatunde85/3d-gen) |
          | motores_alvo | three.js · Unity (Mecanim) · Unreal (UE5) |
          | licenca | ver LICENSE no repo do motor |

          ---

          ## 2. GEOMETRIA E ESCALA

          | Campo | Valor |
          |---|---|
          | unidades | metros |
          | altura | {height_cm} |
          | triangulos | {tris} |
          | materiais | {materials_count} |
          | qualidade | {quality} |
          | LODs | não declarados pelo motor nesta exportação |
          | UV_sets | 1 (UV0 — diffuse/normal) |
          | manifold | assumido OK (motor valida internamente) |
          | tempo_geracao | {build_ms} |

          ---

          ## 3. ESQUELETO

          | Campo | Valor |
          |---|---|
          | rig_type | {rig_type} |
          | rest_pose | {rest_pose}-pose |
          | humanoid_compatible | sim (Mecanim / UE5 Mannequin) |
          | convencao_eixos | Y-up · Z-forward (GLB padrão) |
          | face_bones | {"sim" if face_bones else "não"} |
          | bones_count | extrair do GLB com gltf-pipeline ou Blender |
          | influencias_por_vertice | max 4 (padrão game rig) |

          > ⚠️ Lista completa de bones: executar `scripts/blender_rig_check.py` no GLB exportado.

