          | Triângulos | stdout do motor | > 0 |
          | Materiais | stdout do motor | > 0 |
          | Rig + skinning | `blender_rig_check.py <ficheiro.glb>` | OK · unweighted=0 · leftHandMoved>0.2m |
          | Animações + bones | `npm run test:gltf` | OK · maxRotErr<1° · maxRootErrM<0.01 |
