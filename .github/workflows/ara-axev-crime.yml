          ## MÍNIMO VIÁVEL PARA ANIMAR

          Campos sem os quais **não** se deve animar:
          - `id` · `preset` · `rig` · `rest_pose` · `height` · `tris` · `animations` · `hash_glb`

          ## MÍNIMO PARA ANIMAÇÃO PERFEITA

          Todos os campos acima **mais**:
          - Lista exacta de bones (blender_rig_check)
          - Lista exacta de face/speech shapes (gltf-check)
          - Lista de clips com fps · loop · root_motion por clipe
          - Colisores de física secundária definidos no engine de destino

