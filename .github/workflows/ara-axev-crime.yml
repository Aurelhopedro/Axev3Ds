name: AXEV 3D — Gerar Personagem

on:
  workflow_dispatch:
    inputs:

      # 1
      character_name:
        description: "Nome do personagem"
        required: true
        type: string
        default: "AXEV Character"

      # 2
      preset:
        description: "Preset base"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Yoruba Warrior"
          - "The Maasai Warrior"
          - "The Zulu Warrior"
          - "The Dahomey Warrior"
          - "The American Sheriff"
          - "The Police Officer (Nigeria)"
          - "The FRSC Officer (Nigeria)"
          - "Detective"
          - "The Secret Agent"
          - "The Covert Spy"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "The Gangster"
          - "The Prison Escapee"
          - "The Priest"
          - "The Corporate High-Flier"
          - "The Female Executive"
          - "Businesswoman"
          - "The Arabian Oil Tycoon"
          - "The Miami Dealer"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
          - "The Wasteland Survivor"
          - "The Bride"
          - "The Beach Girl"
          - "Heavy brute"
          - "Elder"
          - "Teen"

      # 3
      gender_age:
        description: "Género e idade (género:idade)"
        required: true
        type: choice
        default: "male:25"
        options:
          - "male:18"
          - "male:25"
          - "male:30"
          - "male:40"
          - "male:50"
          - "male:60"
          - "male:70"
          - "female:18"
          - "female:25"
          - "female:30"
          - "female:40"
          - "female:50"
          - "female:60"
          - "androgynous:25"
          - "androgynous:30"

      # 4
      body:
        description: "Corpo (musculatura:peso:altura)"
        required: true
        type: choice
        default: "medium:average:average"
        options:
          - "slim:very slim:short"
          - "slim:slim:average"
          - "medium:average:average"
          - "athletic:average:tall"
          - "athletic:slim:average"
          - "muscular:average:tall"
          - "muscular:heavy:tall"
          - "very muscular:heavy:very tall"
          - "medium:heavy:average"
          - "medium:very heavy:short"
          - "none:slim:very short"

      # 5
      skin_tone:
        description: "Tom de pele"
        required: true
        type: choice
        default: "mixed"
        options:
          - "very light"
          - "light"
          - "mixed"
          - "dark"
          - "very dark"
          - "african"
          - "asian"
          - "caucasian"

      # 6
      hair:
        description: "Cabelo (estilo:cor)"
        required: true
        type: choice
        default: "short02:black"
        options:
          - "none:black"
          - "buzz:black"
          - "buzz:brown"
          - "short02:black"
          - "short02:brown"
          - "short02:blonde"
          - "short02:grey"
          - "short04:black"
          - "short04:brown"
          - "long01:black"
          - "long01:brown"
          - "long01:blonde"
          - "long01:red"
          - "long01:purple"
          - "bob02:black"
          - "bob02:brown"
          - "afro01:black"
          - "cornrows:black"
          - "box_braids:black"
          - "ponytail01:black"
          - "ponytail01:brown"
          - "braid01:black"
          - "mohawk:black"
          - "mohawk:purple"

      # 7
      facial_hair:
        description: "Pelo facial"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "stubble"
          - "mustache"
          - "mustache_stubble"
          - "goatee"
          - "short_beard"
          - "full_beard"

      # 8
      eyes:
        description: "Cor dos olhos"
        required: true
        type: choice
        default: "brown"
        options:
          - "blackbrown"
          - "darkbrown"
          - "brown"
          - "brownlight"
          - "green"
          - "lightblue"
          - "grey"
          - "ice"

      # 9
      outfit:
        description: "Roupa"
        required: true
        type: choice
        default: "preset_default"
        options:
          - "preset_default"
          - "male_casualsuit01"
          - "male_elegantsuit01"
          - "male_worksuit01"
          - "female_casualsuit02"
          - "female_elegantsuit01"
          - "female_sportsuit01"
          - "set_suit_tie"
          - "set_wedding_gown"
          - "set_cocktail_dress"
          - "set_pantsuit"
          - "set_prison_jumpsuit"
          - "set_street_tee_jeans"
          - "set_clergy"
          - "set_thobe"
          - "fatigue_shirt+fatigue_pants"
          - "uniform_shirt+uniform_trousers"
          - "tank_top+cargo_shorts"
          - "techwear_jacket+techwear_pants"
          - "none"

      # 10
      shoes_hat:
        description: "Calçado:Chapéu"
        required: true
        type: choice
        default: "preset_default:none"
        options:
          - "preset_default:none"
          - "combat_boots:none"
          - "combat_boots:helmet"
          - "combat_boots:beret"
          - "sneakers:baseball_cap"
          - "sneakers:none"
          - "oxfords:none"
          - "oxfords:fedora01"
          - "shoes01:none"
          - "shoes02:none"
          - "heels:none"
          - "sandals:none"
          - "none:cowboy_hat"
          - "shoes03:cowboy_hat"

      # 11
      weapon:
        description: "Arma"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "pistol"
          - "rifle"
          - "shotgun"
          - "smg"
          - "knife"
          - "sword"
          - "axe"
          - "bat"

      # 12
      expression:
        description: "Expressão facial"
        required: true
        type: choice
        default: "neutral"
        options:
          - "neutral"
          - "happy"
          - "angry"
          - "determined"
          - "sad"
          - "surprised"
          - "afraid"

      # 13
      rig_anim:
        description: "Rig:Animações:Pose"
        required: true
        type: choice
        default: "game:yes:A"
        options:
          - "game:yes:A"
          - "game:yes:T"
          - "game:no:A"
          - "game:no:T"
          - "game_lite:yes:A"
          - "game_lite:yes:T"
          - "full:yes:A"
          - "full:yes:T"
          - "none:no:A"

      # 14
      quality:
        description: "Qualidade"
        required: true
        type: choice
        default: "high"
        options:
          - "low"
          - "medium"
          - "high"

      # 15
      export_formats:
        description: "Formatos a exportar"
        required: true
        type: choice
        default: "glb"
        options:
          - "glb"
          - "fbx"
          - "obj"
          - "zip"
          - "glb,fbx"
          - "glb,obj"
          - "glb,fbx,obj"
          - "glb,fbx,obj,zip"

      # 16
      character_id:
        description: "ID do personagem (gerado pela app)"
        required: true
        type: string
        default: "character_001"

      # 17
      config_json:
        description: "JSON do CharacterConfig da app (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: axev-character-${{ github.ref }}-${{ inputs.character_id }}
  cancel-in-progress: false

jobs:
  generate-character:
    name: "Gerar personagem"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. VALIDAÇÃO ────────────────────────────────────────────────────
      - name: Validar inputs
        env:
          INPUT_FORMATS: ${{ inputs.export_formats }}
          INPUT_ID:      ${{ inputs.character_id }}
          INPUT_JSON:    ${{ inputs.config_json }}
        run: |
          set -euo pipefail

          if ! echo "$INPUT_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::character_id inválido: '$INPUT_ID'"
            exit 1
          fi

          ALLOWED="glb fbx obj zip"
          IFS=',' read -ra FMTS <<< "$INPUT_FORMATS"
          for fmt in "${FMTS[@]}"; do
            fmt_clean=$(echo "$fmt" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if ! echo "$ALLOWED" | grep -qw "$fmt_clean"; then
              echo "::error::Formato não suportado: '$fmt_clean'"
              exit 1
            fi
          done
          FORMATS_NORM=$(echo "$INPUT_FORMATS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "FORMATS_NORM=$FORMATS_NORM" >> "$GITHUB_ENV"

          if [ -n "$INPUT_JSON" ]; then
            if ! echo "$INPUT_JSON" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              echo "::error::config_json contém JSON malformado."
              exit 1
            fi
          fi
          echo "✅ Inputs validados. Formatos: $FORMATS_NORM"

      # ─── 2. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout AXEV
        uses: actions/checkout@v4

      # ─── 3. NODE.JS ──────────────────────────────────────────────────────
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ─── 4. CLONAR MOTOR ─────────────────────────────────────────────────
      - name: Clonar Ara 3D Gen
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      # ─── 5. DEPENDÊNCIAS ─────────────────────────────────────────────────
      - name: Instalar dependências
        working-directory: ara-3d-gen
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # ─── 6. CACHE ASSETS ─────────────────────────────────────────────────
      - name: Cache assets MakeHuman
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            ara-3d-gen/vendor
            ara-3d-gen/public/assets
          key: ara3d-assets-v1-${{ hashFiles('ara-3d-gen/scripts/setup-assets.ts', 'ara-3d-gen/scripts/mocap-takes.ts') }}
          restore-keys: ara3d-assets-v1-

      - name: Preparar assets 3D
        working-directory: ara-3d-gen
        run: |
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ] || [ ! -d "vendor/sys/skins" ]; then
            echo "A descarregar assets MakeHuman (~280 MB)..."
            npm run setup-assets
          else
            echo "✅ Assets em cache."
          fi

      # ─── 7. CONSTRUIR PARÂMETROS ──────────────────────────────────────────
      - name: Construir parâmetros do personagem
        env:
          INPUT_PRESET:      ${{ inputs.preset }}
          INPUT_NAME:        ${{ inputs.character_name }}
          INPUT_GENDER_AGE:  ${{ inputs.gender_age }}
          INPUT_BODY:        ${{ inputs.body }}
          INPUT_SKIN:        ${{ inputs.skin_tone }}
          INPUT_HAIR:        ${{ inputs.hair }}
          INPUT_FACIAL_HAIR: ${{ inputs.facial_hair }}
          INPUT_EYES:        ${{ inputs.eyes }}
          INPUT_OUTFIT:      ${{ inputs.outfit }}
          INPUT_SHOES_HAT:   ${{ inputs.shoes_hat }}
          INPUT_WEAPON:      ${{ inputs.weapon }}
          INPUT_EXPRESSION:  ${{ inputs.expression }}
          INPUT_RIG_ANIM:    ${{ inputs.rig_anim }}
          INPUT_QUALITY:     ${{ inputs.quality }}
          INPUT_JSON:        ${{ inputs.config_json }}
        run: |
          mkdir -p axev-build
          python3 << 'PYEOF'
          import json, os

          def env(k, d=""): return os.environ.get(k, d).strip()

          preset = env("INPUT_PRESET", "Athletic man")
          params = {
            "name": env("INPUT_NAME", preset) or preset,
            "detail": env("INPUT_QUALITY", "high").lower(),
          }

          ga = env("INPUT_GENDER_AGE", "male:25").split(":")
          gender_str = ga[0] if len(ga) > 0 else "male"
          age_str    = ga[1] if len(ga) > 1 else "25"
          params["gender"] = 0.0 if gender_str == "female" else (0.5 if gender_str == "androgynous" else 1.0)
          try:
            y = max(12, min(90, int(age_str)))
            params["age"] = round(0.5 + ((y-25)/65)*0.5 if y >= 25 else 0.1875 + ((y-11)/14)*0.3125 if y >= 11 else (y/11)*0.1875, 4)
          except: pass

          muscle_map = {"none":0.1,"slim":0.3,"medium":0.5,"athletic":0.7,"muscular":0.85,"very muscular":1.0}
          weight_map = {"very slim":0.15,"slim":0.3,"average":0.5,"heavy":0.7,"very heavy":0.9}
          height_map = {"very short":0.1,"short":0.3,"average":0.5,"tall":0.7,"very tall":0.9}
          body_parts = env("INPUT_BODY", "medium:average:average").split(":")
          if len(body_parts) >= 1: params["muscle"] = muscle_map.get(body_parts[0], 0.5)
          if len(body_parts) >= 2: params["weight"] = weight_map.get(body_parts[1], 0.5)
          if len(body_parts) >= 3: params["height"] = height_map.get(body_parts[2], 0.5)

          skin_map = {
            "very light":{"african":0.0,"asian":0.05,"caucasian":0.95},
            "light":     {"african":0.0,"asian":0.1, "caucasian":0.9},
            "mixed":     {"african":0.3,"asian":0.2, "caucasian":0.5},
            "dark":      {"african":0.7,"asian":0.1, "caucasian":0.2},
            "very dark": {"african":0.9,"asian":0.05,"caucasian":0.05},
            "african":   {"african":1.0,"asian":0.0, "caucasian":0.0},
            "asian":     {"african":0.0,"asian":1.0, "caucasian":0.0},
            "caucasian": {"african":0.0,"asian":0.0, "caucasian":1.0},
          }
          params.update(skin_map.get(env("INPUT_SKIN","mixed"), {"african":0.3,"asian":0.2,"caucasian":0.5}))

          hair_parts = env("INPUT_HAIR","short02:black").split(":")
          hair_style = hair_parts[0] if len(hair_parts) > 0 else "short02"
          hair_color = hair_parts[1] if len(hair_parts) > 1 else "black"
          if hair_style != "preset_default": params["hair"] = hair_style
          color_map = {"black":"#15100c","dark brown":"#241a13","brown":"#3b2a1d","blonde":"#c8a86b",
                       "red":"#7a2e14","grey":"#6a6060","white":"#c8c0b4","purple":"#4a1a6a","blue":"#1a2a6a","pink":"#c060a0"}
          hc = color_map.get(hair_color)
          if hc: params["hairColor"] = hc

          fh = env("INPUT_FACIAL_HAIR","none")
          if fh != "preset_default": params["facialHair"] = fh

          params["eyes"] = env("INPUT_EYES","brown")
          params["expression"] = env("INPUT_EXPRESSION","neutral")

          w = env("INPUT_WEAPON","none")
          if w not in ("preset_default",""): params["weapon"] = w

          outfit = env("INPUT_OUTFIT","preset_default")
          if outfit == "preset_default":
            pass
          elif "+" in outfit:
            top, bottom = outfit.split("+", 1)
            params["outfit"] = "none"
            params["top"] = top
            params["bottom"] = bottom
          elif outfit == "none":
            params["outfit"] = "none"
          else:
            params["outfit"] = outfit

          sh = env("INPUT_SHOES_HAT","preset_default:none").split(":")
          shoes = sh[0] if len(sh) > 0 else "preset_default"
          hat   = sh[1] if len(sh) > 1 else "none"
          if shoes not in ("preset_default",""): params["shoes"] = shoes
          if hat   not in ("preset_default",""): params["hat"] = hat

          ra = env("INPUT_RIG_ANIM","game:yes:A").split(":")
          params["rig"]        = ra[0] if len(ra) > 0 else "game"
          params["animations"] = (ra[1] if len(ra) > 1 else "yes") == "yes"
          params["restPose"]   = ra[2] if len(ra) > 2 else "A"
          params["faceShapes"]   = True
          params["speechShapes"] = True
          params["faceBones"]    = True

          with open("axev-build/character_overrides.json","w") as f:
            json.dump(params, f, indent=2)
          print("✅ Parâmetros prontos:")
          print(json.dumps(params, indent=2))
          PYEOF

      # ─── 8. GERAR PERSONAGEM ──────────────────────────────────────────────
      - name: Gerar personagem com Ara 3D Gen
        working-directory: ara-3d-gen
        env:
          FORMATS_NORM:    ${{ env.FORMATS_NORM }}
          RESOLVED_PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          mkdir -p out

          cat > merge-params.ts << 'TSEOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { DEFAULT_PARAMS, PRESETS } from './src/core/params';

          const presetName = process.env.RESOLVED_PRESET ?? 'Athletic man';
          const preset = (PRESETS as Record<string, object>)[presetName] ?? {};
          const overrides = JSON.parse(readFileSync('../axev-build/character_overrides.json', 'utf8'));
          const final = { ...DEFAULT_PARAMS, ...preset, ...overrides };
          writeFileSync('../axev-build/character.params.json', JSON.stringify(final, null, 2));
          console.log(`✅ Preset "${presetName}" + ${Object.keys(overrides).length} overrides combinados.`);
          TSEOF

          npx tsx merge-params.ts

          echo "A gerar com formatos: $FORMATS_NORM"
          npm run export -- \
            --params "../axev-build/character.params.json" \
            --formats "$FORMATS_NORM" \
            --out out

          echo "✅ Geração concluída."
          find out -type f -printf '  %p (%s bytes)\n'

      # ─── 8b. GERAR CATÁLOGO DE PERSONAGEM (CLAUDE AI) ────────────────────
      - name: Gerar especificação de catálogo (Claude AI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHARACTER_ID:      ${{ inputs.character_id }}
          CHARACTER_NAME:    ${{ inputs.character_name }}
          PRESET:            ${{ inputs.preset }}
          GENDER_AGE:        ${{ inputs.gender_age }}
          BODY:              ${{ inputs.body }}
          SKIN:              ${{ inputs.skin_tone }}
          HAIR:              ${{ inputs.hair }}
          FACIAL_HAIR:       ${{ inputs.facial_hair }}
          EYES:              ${{ inputs.eyes }}
          OUTFIT:            ${{ inputs.outfit }}
          SHOES_HAT:         ${{ inputs.shoes_hat }}
          WEAPON:            ${{ inputs.weapon }}
          EXPRESSION:        ${{ inputs.expression }}
          RIG_ANIM:          ${{ inputs.rig_anim }}
          QUALITY:           ${{ inputs.quality }}
          FORMATS_NORM:      ${{ env.FORMATS_NORM }}
          RUN_NUMBER:        ${{ github.run_number }}
          REPO:              ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p axev-output

          PARAMS_JSON=$(cat axev-build/character.params.json 2>/dev/null || echo "{}")
          FILES_LIST=$(find ara-3d-gen/out -type f -printf '%P (%s bytes)\n' 2>/dev/null || echo "nenhum")
          DATA=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          api_key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not api_key:
              print("::warning::ANTHROPIC_API_KEY não definida — catálogo ignorado.")
              with open("axev-output/AXEV_CHARACTER_CATALOG.md", "w") as f:
                  f.write("# AXEV Character Catalog\n\n> ⚠️ ANTHROPIC_API_KEY não configurada. Catálogo não gerado.\n")
              exit(0)

          params_json  = os.environ.get("PARAMS_JSON", "{}")
          files_list   = os.environ.get("FILES_LIST", "nenhum")
          data         = os.environ.get("DATA", "")
          char_id      = os.environ.get("CHARACTER_ID", "")
          char_name    = os.environ.get("CHARACTER_NAME", "")
          preset       = os.environ.get("PRESET", "")
          gender_age   = os.environ.get("GENDER_AGE", "")
          body         = os.environ.get("BODY", "")
          skin         = os.environ.get("SKIN", "")
          hair         = os.environ.get("HAIR", "")
          facial_hair  = os.environ.get("FACIAL_HAIR", "")
          eyes         = os.environ.get("EYES", "")
          outfit       = os.environ.get("OUTFIT", "")
          shoes_hat    = os.environ.get("SHOES_HAT", "")
          weapon       = os.environ.get("WEAPON", "")
          expression   = os.environ.get("EXPRESSION", "")
          rig_anim     = os.environ.get("RIG_ANIM", "")
          quality      = os.environ.get("QUALITY", "")
          formats      = os.environ.get("FORMATS_NORM", "")
          run_number   = os.environ.get("RUN_NUMBER", "")
          repo         = os.environ.get("REPO", "")

          user_prompt = f"""Atua como Technical Art Director / Character Pipeline Specialist.

          CONTEXTO:
          Tenho um catálogo de personagem 3D (metadados + ficheiro GLB) e quero
          garantir que ele contenha TODA a informação necessária para animar o
          personagem da forma mais apropriada possível (game, cinemática, facial,
          fala, física secundária). Produz uma ESPECIFICAÇÃO DE CATÁLOGO completa,
          estruturada e verificável.

          DADOS DO PERSONAGEM GERADO:
          - ID: {char_id}
          - Nome: {char_name}
          - Preset: {preset}
          - Género/Idade: {gender_age}
          - Corpo: {body}
          - Tom de pele: {skin}
          - Cabelo: {hair}
          - Pelo facial: {facial_hair}
          - Olhos: {eyes}
          - Outfit: {outfit}
          - Calçado/Chapéu: {shoes_hat}
          - Arma: {weapon}
          - Expressão: {expression}
          - Rig/Anim: {rig_anim}
          - Qualidade: {quality}
          - Formatos exportados: {formats}
          - Ficheiros produzidos: {files_list}
          - Parâmetros completos: {params_json}
          - Run: #{run_number} | Repo: {repo}
          - Data de geração: {data}

          TAREFA:
          Gera um documento de especificação de catálogo de personagem com as
          secções abaixo. Para CADA campo indica: (a) nome do campo, (b) tipo de
          dado, (c) se é OBRIGATÓRIO ou OPCIONAL, (d) exemplo de valor preenchido
          com os dados reais deste personagem, (e) PORQUE é necessário para
          animação, e (f) o ERRO/ARMADILHA típica se o campo faltar ou vier mal
          preenchido.

          SECÇÕES OBRIGATÓRIAS DO CATÁLOGO:

          1. IDENTIFICAÇÃO E VERSÃO
             - id, nome, versão do asset, versão do pipeline, hash do ficheiro,
               data, autor, motor(es) alvo, licença.

          2. GEOMETRIA E ESCALA
             - unidades (metros/cm), escala real, altura em unidades, contagem de
               vértices/triângulos, LODs (níveis e contagens), UV sets, materiais,
               texturas (resolução, canais), se é manifold/watertight.

          3. ESQUELETO (SKELETON SPEC) — CRÍTICO
             - lista completa de bones (nome, parent, posição de repouso, limites
               de rotação, se é deform bone ou control bone), root bone, se é
               Humanoid/Mecanim-compatible, convenção de eixos (forward/up),
               A-pose vs T-pose, número de influências por vértice.

          4. SKINNING / DEFORMAÇÃO
             - max influences, pesos normalizados?, áreas de risco (cotovelos,
               joelhos, axilas, virilha), relatório de qualidade de skinning,
               correções aplicadas.

          5. ANIMAÇÕES EMBUTIDAS (ANIMATION MANIFEST) — CRÍTICO
             - para cada clipe: nome, fps, duração, loop (sim/não), root motion
               (sim/não), frame range, tipo (idle/walk/run/aim/reload...), se é
               additive, blend space recomendado.

          6. ANIMAÇÃO FACIAL E FALA — CRÍTICO
             - lista de blendshapes/morph targets (nome exato, range 0–1, eixo),
               jaw/mouth/eyes/brows, teeth/tongue (presença e rig), visemes
               (mapa fonema→shape), expressões base.

          7. FÍSICA SECUNDÁRIA
             - cabelo, tecido (top/bottom), acessórios (tactical_vest, helmet,
               belt) — quais têm bones próprios, colisores, simulação (cloth/hair)
               ou rig manual.

          8. ROOT MOTION E LOCOMOÇÃO
             - se root tem motion, eixo forward, se há root bone separado,
               ground plane / foot contact, IK targets (pés/mãos), footstep events.

          9. MATERIAIS E RENDER
             - shader model, canais (albedo, normal, roughness, metallic, AO,
               emissive), se é PBR, transparência, blend shapes afetam normais?

          10. METADADOS DE PRODUÇÃO
              - preset, seed, parâmetros de geração (ex.: gender/age/muscle/
                proportions), formatos exportados (glb/fbx/usd), tamanho,
                ferramenta de origem, yml/config usado.

          11. VALIDAÇÃO E QA (CHECKLIST)
              - lista de verificações automáticas: escala, bones, shapes, clipes,
                materiais, LODs, root motion. Cada uma com PASS/FAIL esperado.

          FORMATO DE SAÍDA:
          - Ficheiro Markdown completo.
          - Tabela por secção (Campo | Tipo | Obrigatório? | Valor neste personagem | Porquê | Armadilha se faltar).
          - No fim: RESUMO "MÍNIMO VIÁVEL PARA ANIMAR" e RESUMO "MÍNIMO PARA ANIMAÇÃO PERFEITA".
          - Destaca com ⚠️ os campos NÃO INFALÍVEIS (falha silenciosa).
          - Usa os dados reais deste personagem em todos os exemplos.
          - Língua: Português.

          RESTRIÇÕES:
          - Não inventes campos inúteis; foca no que impacta animação.
          - Sê explícito sobre OBRIGATÓRIO vs OPCIONAL.
          - Usa linguagem técnica mas clara."""

          payload = {
              "model": "claude-sonnet-4-6",
              "max_tokens": 8000,
              "messages": [{"role": "user", "content": user_prompt}]
          }

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
              catalog_md = result["content"][0]["text"]
              print("✅ Catálogo gerado pelo Claude AI.")
          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8")
              print(f"::warning::Erro na API Claude ({e.code}): {error_body}")
              catalog_md = f"# AXEV Character Catalog\n\n> ⚠️ Erro ao gerar catálogo via Claude API (HTTP {e.code}).\n\n```\n{error_body}\n```\n"
          except Exception as e:
              print(f"::warning::Exceção ao chamar Claude API: {e}")
              catalog_md = f"# AXEV Character Catalog\n\n> ⚠️ Erro inesperado ao gerar catálogo: {e}\n"

          with open("axev-output/AXEV_CHARACTER_CATALOG.md", "w", encoding="utf-8") as f:
              f.write(catalog_md)

          print(f"📄 Catálogo guardado: axev-output/AXEV_CHARACTER_CATALOG.md ({len(catalog_md)} chars)")
          PYEOF

      # ─── 9. VALIDAR ───────────────────────────────────────────────────────
      - name: Validar ficheiros exportados
        env:
          FORMATS_NORM: ${{ env.FORMATS_NORM }}
        run: |
          set -euo pipefail
          OUT="ara-3d-gen/out"
          if [ ! -d "$OUT" ] || [ -z "$(find "$OUT" -type f -print -quit)" ]; then
            echo "::error::Nenhum ficheiro exportado."
            exit 1
          fi
          IFS=',' read -ra FMTS <<< "$FORMATS_NORM"
          for fmt in "${FMTS[@]}"; do
            fmt=$(echo "$fmt" | tr -d '[:space:]')
            FILES=$(find "$OUT" -name "*.${fmt}" -type f 2>/dev/null)
            if [ -z "$FILES" ]; then
              echo "::error::Formato $fmt não produzido."
              exit 1
            fi
            for f in $FILES; do
              SIZE=$(stat -c%s "$f")
              echo "✅ $fmt: $f ($(( SIZE / 1024 )) KB)"
            done
          done
          echo "✅ Todos os formatos validados."

      # ─── 10. RELATÓRIO E ARTEFACTO ────────────────────────────────────────
      - name: Criar relatório e publicar artefacto
        env:
          CHARACTER_ID:   ${{ inputs.character_id }}
          CHARACTER_NAME: ${{ inputs.character_name }}
          PRESET:         ${{ inputs.preset }}
          GENDER_AGE:     ${{ inputs.gender_age }}
          BODY:           ${{ inputs.body }}
          SKIN:           ${{ inputs.skin_tone }}
          HAIR:           ${{ inputs.hair }}
          EYES:           ${{ inputs.eyes }}
          OUTFIT:         ${{ inputs.outfit }}
          WEAPON:         ${{ inputs.weapon }}
          EXPRESSION:     ${{ inputs.expression }}
          RIG_ANIM:       ${{ inputs.rig_anim }}
          FORMATS_NORM:   ${{ env.FORMATS_NORM }}
          QUALITY:        ${{ inputs.quality }}
          RUN_NUMBER:     ${{ github.run_number }}
          REPO:           ${{ github.repository }}
        run: |
          mkdir -p axev-output/exports
          cp -r ara-3d-gen/out/. axev-output/exports/ 2>/dev/null || true
          cp axev-build/character.params.json axev-output/AXEV_CHARACTER_PARAMS.json 2>/dev/null || true

          FILES_LIST=$(find axev-output/exports -type f -printf '  - %P (%s bytes)\n' 2>/dev/null || echo "  (nenhum)")
          DATA=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat > axev-output/AXEV_CHARACTER_REPORT.md << EOF
          # AXEV 3D — Relatório do Personagem

          ## Identificação
          - **ID**: ${CHARACTER_ID}
          - **Nome**: ${CHARACTER_NAME}
          - **Run**: #${RUN_NUMBER} | **Repo**: ${REPO}
          - **Data**: ${DATA}

          ## Configuração
          | Campo | Valor |
          |-------|-------|
          | Preset | ${PRESET} |
          | Género/Idade | ${GENDER_AGE} |
          | Corpo | ${BODY} |
          | Pele | ${SKIN} |
          | Cabelo | ${HAIR} |
          | Olhos | ${EYES} |
          | Outfit | ${OUTFIT} |
          | Arma | ${WEAPON} |
          | Expressão | ${EXPRESSION} |
          | Rig/Anim | ${RIG_ANIM} |
          | Qualidade | ${QUALITY} |
          | Formatos | ${FORMATS_NORM} |

          ## Ficheiros Produzidos
          ${FILES_LIST}

          ## Documentação
          - 📄 [Especificação de Catálogo](./AXEV_CHARACTER_CATALOG.md)
          - 📄 [Parâmetros Completos](./AXEV_CHARACTER_PARAMS.json)

          ---
          *Gerado por AXEV 3D Studio — ara-axev-crime.yml*
          EOF

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AXEV-CHARACTER-${{ inputs.character_id }}
          path: axev-output/
          if-no-files-found: error
          retention-days: 14
