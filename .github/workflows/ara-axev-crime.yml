name: AXEV 3D — Gerar Personagem

on:
  workflow_dispatch:
    inputs:

      # ── IDENTIDADE ────────────────────────────────────────────────────────
      character_name:
        description: "Nome do personagem (texto livre)"
        required: true
        type: string
        default: "AXEV Character"

      preset:
        description: "Preset base do personagem"
        required: true
        type: choice
        default: "The Soldier"
        options:
          - "Athletic man"
          - "Athletic woman"
          - "The Soldier"
          - "The African Warrior"
          - "The Yoruba Warrior"
          - "The Maasai Warrior"
          - "The Zulu Warrior"
          - "The Dahomey Warrior"
          - "The American Sheriff"
          - "The Police Officer (Nigeria)"
          - "The FRSC Officer (Nigeria)"
          - "Detective"
          - "The Secret Agent"
          - "The Covert Spy"
          - "The Professional Hitman"
          - "The Bodyguard"
          - "The Gangster"
          - "The Prison Escapee"
          - "The Priest"
          - "The Corporate High-Flier"
          - "The Female Executive"
          - "Businesswoman"
          - "The Arabian Oil Tycoon"
          - "The Miami Dealer"
          - "The Adventurer"
          - "The Cyberpunk Hacker"
          - "The Wasteland Survivor"
          - "The Bride"
          - "The Beach Girl"
          - "Heavy brute"
          - "Elder"
          - "Teen"

      gender:
        description: "Género"
        required: true
        type: choice
        default: "male"
        options:
          - "male"
          - "female"
          - "androgynous"

      age:
        description: "Idade aproximada"
        required: true
        type: choice
        default: "25"
        options:
          - "16"
          - "18"
          - "20"
          - "25"
          - "30"
          - "35"
          - "40"
          - "45"
          - "50"
          - "55"
          - "60"
          - "65"
          - "70"
          - "80"
          - "90"

      # ── CORPO ────────────────────────────────────────────────────────────
      muscle:
        description: "Musculatura"
        required: true
        type: choice
        default: "medium"
        options:
          - "none"
          - "slim"
          - "medium"
          - "athletic"
          - "muscular"
          - "very muscular"

      weight:
        description: "Peso corporal"
        required: true
        type: choice
        default: "average"
        options:
          - "very slim"
          - "slim"
          - "average"
          - "heavy"
          - "very heavy"

      height:
        description: "Altura"
        required: true
        type: choice
        default: "average"
        options:
          - "very short"
          - "short"
          - "average"
          - "tall"
          - "very tall"

      skin_tone:
        description: "Tom de pele / etnia"
        required: true
        type: choice
        default: "mixed"
        options:
          - "very light"
          - "light"
          - "mixed"
          - "dark"
          - "very dark"
          - "african"
          - "asian"
          - "caucasian"

      # ── CABELO ───────────────────────────────────────────────────────────
      hair_style:
        description: "Estilo de cabelo"
        required: true
        type: choice
        default: "short02"
        options:
          - "none"
          - "buzz"
          - "mohawk"
          - "short01"
          - "short02"
          - "short03"
          - "short04"
          - "long01"
          - "bob01"
          - "bob02"
          - "ponytail01"
          - "braid01"
          - "afro01"
          - "cornrows"
          - "box_braids"

      hair_color:
        description: "Cor do cabelo"
        required: true
        type: choice
        default: "black"
        options:
          - "black"
          - "dark brown"
          - "brown"
          - "blonde"
          - "red"
          - "grey"
          - "white"
          - "purple"
          - "blue"
          - "pink"

      facial_hair:
        description: "Pelo facial (homens)"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "stubble"
          - "mustache"
          - "mustache_stubble"
          - "goatee"
          - "short_beard"
          - "full_beard"

      # ── OLHOS ────────────────────────────────────────────────────────────
      eyes:
        description: "Cor dos olhos"
        required: true
        type: choice
        default: "brown"
        options:
          - "blackbrown"
          - "darkbrown"
          - "brown"
          - "brownlight"
          - "green"
          - "lightblue"
          - "grey"
          - "ice"

      # ── ROUPA ────────────────────────────────────────────────────────────
      outfit:
        description: "Roupa / outfit completo (sobrepõe top+bottom se escolhido)"
        required: true
        type: choice
        default: "preset_default"
        options:
          - "preset_default"
          - "male_casualsuit01"
          - "male_casualsuit05"
          - "male_elegantsuit01"
          - "male_worksuit01"
          - "female_casualsuit02"
          - "female_elegantsuit01"
          - "female_sportsuit01"
          - "set_suit_tie"
          - "set_wedding_gown"
          - "set_cocktail_dress"
          - "set_pantsuit"
          - "set_prison_jumpsuit"
          - "set_street_tee_jeans"
          - "set_thobe"
          - "set_pastel_suit"
          - "set_clergy"
          - "none"

      top:
        description: "Top separado (apenas se outfit = none)"
        required: true
        type: choice
        default: "preset_default"
        options:
          - "preset_default"
          - "none"
          - "fatigue_shirt"
          - "uniform_shirt"
          - "tank_top"
          - "tunic"
          - "long_tunic"
          - "techwear_jacket"
          - "tattered_shirt"
          - "sheriff_shirt"
          - "tank_top"

      bottom:
        description: "Bottom separado (apenas se outfit = none)"
        required: true
        type: choice
        default: "preset_default"
        options:
          - "preset_default"
          - "none"
          - "fatigue_pants"
          - "uniform_trousers"
          - "cargo_shorts"
          - "trousers"
          - "loincloth"
          - "wrapper_knee"
          - "hide_aprons"
          - "techwear_pants"
          - "tattered_pants"
          - "sheriff_trousers"

      shoes:
        description: "Calçado"
        required: true
        type: choice
        default: "preset_default"
        options:
          - "preset_default"
          - "none"
          - "shoes01"
          - "shoes02"
          - "shoes03"
          - "shoes04"
          - "shoes06"
          - "combat_boots"
          - "oxfords"
          - "sneakers"
          - "heels"
          - "loafers"
          - "sandals"
          - "flipflops"
          - "slides"

      hat:
        description: "Chapéu / cobertura de cabeça"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "preset_default"
          - "baseball_cap"
          - "helmet"
          - "beret"
          - "fedora01"
          - "fedora_cocked"
          - "cowboy_hat"
          - "keffiyeh"
          - "fila_cap"

      # ── ACESSÓRIOS E ARMAS ────────────────────────────────────────────────
      weapon:
        description: "Arma na mão direita"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "pistol"
          - "rifle"
          - "shotgun"
          - "smg"
          - "knife"
          - "sword"
          - "axe"
          - "bat"

      expression:
        description: "Expressão facial"
        required: true
        type: choice
        default: "neutral"
        options:
          - "neutral"
          - "happy"
          - "angry"
          - "determined"
          - "sad"
          - "surprised"
          - "afraid"

      # ── RIG E ANIMAÇÕES ──────────────────────────────────────────────────
      rig:
        description: "Tipo de rig (esqueleto)"
        required: true
        type: choice
        default: "game"
        options:
          - "game"
          - "game_lite"
          - "full"
          - "none"

      animations:
        description: "Incluir animações no export"
        required: true
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"

      rest_pose:
        description: "Pose de descanso do rig"
        required: true
        type: choice
        default: "A"
        options:
          - "A"
          - "T"

      face_shapes:
        description: "Incluir blend shapes faciais (expressões)"
        required: true
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"

      # ── QUALIDADE E EXPORTAÇÃO ────────────────────────────────────────────
      quality:
        description: "Nível de detalhe / qualidade"
        required: true
        type: choice
        default: "high"
        options:
          - "low"
          - "medium"
          - "high"

      export_formats:
        description: "Formatos a exportar"
        required: true
        type: choice
        default: "glb"
        options:
          - "glb"
          - "fbx"
          - "obj"
          - "zip"
          - "glb,fbx"
          - "glb,obj"
          - "glb,fbx,obj"
          - "glb,fbx,obj,zip"

      # ── IDs PARA COMPATIBILIDADE COM A APP ───────────────────────────────
      character_id:
        description: "ID do personagem (gerado pela app, ou deixar o default)"
        required: true
        type: string
        default: "character_001"

      config_json:
        description: "JSON do CharacterConfig da app Android (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: axev-character-${{ github.ref }}-${{ inputs.character_id }}
  cancel-in-progress: false

jobs:
  generate-character:
    name: "Gerar personagem"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. VALIDAÇÃO ────────────────────────────────────────────────────
      - name: Validar inputs
        env:
          INPUT_FORMATS: ${{ inputs.export_formats }}
          INPUT_QUALITY: ${{ inputs.quality }}
          INPUT_ID:      ${{ inputs.character_id }}
          INPUT_JSON:    ${{ inputs.config_json }}
        run: |
          set -euo pipefail

          if ! echo "$INPUT_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::character_id inválido: '$INPUT_ID'"
            exit 1
          fi

          ALLOWED="glb fbx obj zip"
          IFS=',' read -ra FMTS <<< "$INPUT_FORMATS"
          for fmt in "${FMTS[@]}"; do
            fmt_clean=$(echo "$fmt" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if ! echo "$ALLOWED" | grep -qw "$fmt_clean"; then
              echo "::error::Formato não suportado: '$fmt_clean'"
              exit 1
            fi
          done
          FORMATS_NORM=$(echo "$INPUT_FORMATS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "FORMATS_NORM=$FORMATS_NORM" >> "$GITHUB_ENV"

          if [ -n "$INPUT_JSON" ]; then
            if ! echo "$INPUT_JSON" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              echo "::error::config_json contém JSON malformado."
              exit 1
            fi
          fi

          echo "✅ Inputs validados. Formatos: $FORMATS_NORM"

      # ─── 2. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout AXEV
        uses: actions/checkout@v4

      # ─── 3. NODE.JS ──────────────────────────────────────────────────────
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ─── 4. CLONAR MOTOR ─────────────────────────────────────────────────
      - name: Clonar Ara 3D Gen
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      # ─── 5. DEPENDÊNCIAS ─────────────────────────────────────────────────
      - name: Instalar dependências
        working-directory: ara-3d-gen
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # ─── 6. CACHE ASSETS ─────────────────────────────────────────────────
      - name: Cache assets MakeHuman
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            ara-3d-gen/vendor
            ara-3d-gen/public/assets
          key: ara3d-assets-v1-${{ hashFiles('ara-3d-gen/scripts/setup-assets.ts', 'ara-3d-gen/scripts/mocap-takes.ts') }}
          restore-keys: ara3d-assets-v1-

      - name: Preparar assets 3D
        working-directory: ara-3d-gen
        run: |
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ] || [ ! -d "vendor/sys/skins" ]; then
            echo "A descarregar assets MakeHuman (~280 MB)..."
            npm run setup-assets
          else
            echo "✅ Assets em cache."
          fi

      # ─── 7. CONSTRUIR PARÂMETROS ──────────────────────────────────────────
      - name: Construir parâmetros do personagem
        env:
          INPUT_PRESET:       ${{ inputs.preset }}
          INPUT_NAME:         ${{ inputs.character_name }}
          INPUT_GENDER:       ${{ inputs.gender }}
          INPUT_AGE:          ${{ inputs.age }}
          INPUT_MUSCLE:       ${{ inputs.muscle }}
          INPUT_WEIGHT:       ${{ inputs.weight }}
          INPUT_HEIGHT:       ${{ inputs.height }}
          INPUT_SKIN:         ${{ inputs.skin_tone }}
          INPUT_HAIR_STYLE:   ${{ inputs.hair_style }}
          INPUT_HAIR_COLOR:   ${{ inputs.hair_color }}
          INPUT_FACIAL_HAIR:  ${{ inputs.facial_hair }}
          INPUT_EYES:         ${{ inputs.eyes }}
          INPUT_OUTFIT:       ${{ inputs.outfit }}
          INPUT_TOP:          ${{ inputs.top }}
          INPUT_BOTTOM:       ${{ inputs.bottom }}
          INPUT_SHOES:        ${{ inputs.shoes }}
          INPUT_HAT:          ${{ inputs.hat }}
          INPUT_WEAPON:       ${{ inputs.weapon }}
          INPUT_EXPRESSION:   ${{ inputs.expression }}
          INPUT_RIG:          ${{ inputs.rig }}
          INPUT_ANIMATIONS:   ${{ inputs.animations }}
          INPUT_REST_POSE:    ${{ inputs.rest_pose }}
          INPUT_FACE_SHAPES:  ${{ inputs.face_shapes }}
          INPUT_QUALITY:      ${{ inputs.quality }}
          INPUT_JSON:         ${{ inputs.config_json }}
        run: |
          mkdir -p axev-build
          python3 << 'PYEOF'
          import json, os

          def env(k, d=""): return os.environ.get(k, d).strip()

          preset = env("INPUT_PRESET", "Athletic man")

          # Defaults base
          params = {
            "name": env("INPUT_NAME", preset) or preset,
            "detail": env("INPUT_QUALITY", "high").lower(),
            "rig": env("INPUT_RIG", "game"),
            "restPose": env("INPUT_REST_POSE", "A"),
            "animations": env("INPUT_ANIMATIONS", "yes") == "yes",
            "faceShapes": env("INPUT_FACE_SHAPES", "yes") == "yes",
            "speechShapes": True,
            "faceBones": True,
          }

          # Género
          g = env("INPUT_GENDER", "male")
          params["gender"] = 0.0 if g == "female" else (0.5 if g == "androgynous" else 1.0)

          # Idade
          try:
            y = int(env("INPUT_AGE", "25"))
            y = max(12, min(90, y))
            if y < 25:
              params["age"] = 0.1875 + ((y-11)/14)*0.3125 if y >= 11 else (y/11)*0.1875
            else:
              params["age"] = 0.5 + ((y-25)/65)*0.5
          except: pass

          # Musculatura
          muscle_map = {"none":0.1,"slim":0.3,"medium":0.5,"athletic":0.7,"muscular":0.85,"very muscular":1.0}
          params["muscle"] = muscle_map.get(env("INPUT_MUSCLE","medium"), 0.6)

          # Peso
          weight_map = {"very slim":0.15,"slim":0.3,"average":0.5,"heavy":0.7,"very heavy":0.9}
          params["weight"] = weight_map.get(env("INPUT_WEIGHT","average"), 0.5)

          # Altura
          height_map = {"very short":0.1,"short":0.3,"average":0.5,"tall":0.7,"very tall":0.9}
          params["height"] = height_map.get(env("INPUT_HEIGHT","average"), 0.5)

          # Tom de pele
          skin_map = {
            "very light":  {"african":0.0,"asian":0.05,"caucasian":0.95},
            "light":       {"african":0.0,"asian":0.1,"caucasian":0.9},
            "mixed":       {"african":0.3,"asian":0.2,"caucasian":0.5},
            "dark":        {"african":0.7,"asian":0.1,"caucasian":0.2},
            "very dark":   {"african":0.9,"asian":0.05,"caucasian":0.05},
            "african":     {"african":1.0,"asian":0.0,"caucasian":0.0},
            "asian":       {"african":0.0,"asian":1.0,"caucasian":0.0},
            "caucasian":   {"african":0.0,"asian":0.0,"caucasian":1.0},
          }
          params.update(skin_map.get(env("INPUT_SKIN","mixed"), {"african":0.3,"asian":0.2,"caucasian":0.5}))

          # Cabelo
          h = env("INPUT_HAIR_STYLE","short02")
          if h != "preset_default": params["hair"] = h

          hair_color_map = {
            "black":"#15100c","dark brown":"#241a13","brown":"#3b2a1d",
            "blonde":"#c8a86b","red":"#7a2e14","grey":"#6a6060",
            "white":"#c8c0b4","purple":"#4a1a6a","blue":"#1a2a6a","pink":"#c060a0",
          }
          hc = hair_color_map.get(env("INPUT_HAIR_COLOR","black"))
          if hc: params["hairColor"] = hc

          # Pelo facial
          fh = env("INPUT_FACIAL_HAIR","none")
          if fh != "preset_default": params["facialHair"] = fh

          # Olhos
          params["eyes"] = env("INPUT_EYES","brown")

          # Expressão
          params["expression"] = env("INPUT_EXPRESSION","neutral")

          # Arma
          w = env("INPUT_WEAPON","none")
          if w != "preset_default": params["weapon"] = w

          # Roupa
          outfit = env("INPUT_OUTFIT","preset_default")
          if outfit == "preset_default":
            pass  # usa o preset
          elif outfit == "none":
            params["outfit"] = "none"
            top = env("INPUT_TOP","preset_default")
            bottom = env("INPUT_BOTTOM","preset_default")
            if top not in ("preset_default",""): params["top"] = top
            if bottom not in ("preset_default",""): params["bottom"] = bottom
          else:
            params["outfit"] = outfit

          shoes = env("INPUT_SHOES","preset_default")
          if shoes not in ("preset_default",""): params["shoes"] = shoes

          hat = env("INPUT_HAT","none")
          if hat not in ("preset_default",""): params["hat"] = hat

          # Se foi fornecido config_json, merge (prioridade: inputs do workflow > config_json)
          config_json_str = env("INPUT_JSON","")
          if config_json_str:
            try:
              app_cfg = json.loads(config_json_str)
              # guardar original
              with open("axev-build/app_config_original.json","w") as f:
                json.dump(app_cfg, f, indent=2)
            except: pass

          with open("axev-build/character_overrides.json","w") as f:
            json.dump(params, f, indent=2)

          print("✅ Parâmetros calculados:")
          print(json.dumps(params, indent=2))
          PYEOF
          echo "RESOLVED_PRESET=${{ inputs.preset }}" >> "$GITHUB_ENV"

      # ─── 8. GERAR PERSONAGEM ──────────────────────────────────────────────
      - name: Gerar personagem com Ara 3D Gen
        working-directory: ara-3d-gen
        env:
          FORMATS_NORM:    ${{ env.FORMATS_NORM }}
          RESOLVED_PRESET: ${{ inputs.preset }}
          INPUT_QUALITY:   ${{ inputs.quality }}
        run: |
          set -euo pipefail
          mkdir -p out

          # Combinar preset + overrides
          node --input-type=module << 'JSEOF'
          import { readFileSync, writeFileSync } from 'fs';
          import { DEFAULT_PARAMS, PRESETS } from './src/core/params.js';

          const preset = PRESETS[process.env.RESOLVED_PRESET] ?? {};
          const overrides = JSON.parse(readFileSync('../axev-build/character_overrides.json','utf8'));
          const final = { ...DEFAULT_PARAMS, ...preset, ...overrides };
          writeFileSync('../axev-build/character.params.json', JSON.stringify(final, null, 2));
          console.log('✅ Parâmetros finais: preset "' + process.env.RESOLVED_PRESET + '" + ' + Object.keys(overrides).length + ' overrides');
          JSEOF

          echo "A gerar personagem..."
          npm run export -- \
            --params "../axev-build/character.params.json" \
            --formats "$FORMATS_NORM" \
            --out out

          echo "✅ Geração concluída."
          find out -type f -printf '  %p (%s bytes)\n'

      # ─── 9. VALIDAR RESULTADOS ────────────────────────────────────────────
      - name: Validar ficheiros exportados
        env:
          FORMATS_NORM: ${{ env.FORMATS_NORM }}
        run: |
          set -euo pipefail
          OUT="ara-3d-gen/out"

          if [ ! -d "$OUT" ] || [ -z "$(find "$OUT" -type f -print -quit)" ]; then
            echo "::error::Nenhum ficheiro exportado em '$OUT'."
            exit 1
          fi

          IFS=',' read -ra FMTS <<< "$FORMATS_NORM"
          for fmt in "${FMTS[@]}"; do
            fmt=$(echo "$fmt" | tr -d '[:space:]')
            FILES=$(find "$OUT" -name "*.${fmt}" -type f 2>/dev/null)
            if [ -z "$FILES" ]; then
              echo "::error::Formato $fmt solicitado mas não produzido."
              exit 1
            fi
            for f in $FILES; do
              SIZE=$(stat -c%s "$f")
              echo "✅ $fmt: $f ($(( SIZE / 1024 )) KB)"
            done
          done
          echo "✅ Todos os formatos validados."

      # ─── 10. RELATÓRIO ───────────────────────────────────────────────────
      - name: Criar relatório técnico
        env:
          CHARACTER_ID:   ${{ inputs.character_id }}
          CHARACTER_NAME: ${{ inputs.character_name }}
          PRESET:         ${{ inputs.preset }}
          GENDER:         ${{ inputs.gender }}
          AGE:            ${{ inputs.age }}
          MUSCLE:         ${{ inputs.muscle }}
          WEIGHT:         ${{ inputs.weight }}
          HEIGHT_VAL:     ${{ inputs.height }}
          SKIN:           ${{ inputs.skin_tone }}
          HAIR:           ${{ inputs.hair_style }}
          HAIR_COLOR:     ${{ inputs.hair_color }}
          EYES:           ${{ inputs.eyes }}
          OUTFIT:         ${{ inputs.outfit }}
          WEAPON:         ${{ inputs.weapon }}
          EXPRESSION:     ${{ inputs.expression }}
          RIG:            ${{ inputs.rig }}
          ANIMATIONS:     ${{ inputs.animations }}
          FORMATS_NORM:   ${{ env.FORMATS_NORM }}
          QUALITY:        ${{ inputs.quality }}
          RUN_NUMBER:     ${{ github.run_number }}
          REPO:           ${{ github.repository }}
        run: |
          mkdir -p axev-output/exports
          cp -r ara-3d-gen/out/. axev-output/exports/ 2>/dev/null || true
          cp axev-build/character.params.json axev-output/AXEV_CHARACTER_PARAMS.json 2>/dev/null || true

          FILES_LIST=$(find axev-output/exports -type f -printf '  - %P (%s bytes)\n' 2>/dev/null || echo "  (nenhum)")
          DATA=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat > axev-output/AXEV_CHARACTER_REPORT.md << EOF
          # AXEV 3D — Relatório do Personagem

          ## Identificação
          - **ID**: ${CHARACTER_ID}
          - **Nome**: ${CHARACTER_NAME}
          - **Run**: #${RUN_NUMBER} | **Repo**: ${REPO}
          - **Data**: ${DATA}

          ## Configuração
          | Campo | Valor |
          |-------|-------|
          | Preset | ${PRESET} |
          | Género | ${GENDER} |
          | Idade | ${AGE} anos |
