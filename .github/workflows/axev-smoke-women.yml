name: AXEV 3D — Smoke Test Women

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # MATRIZ DE TESTE — 7 combinações femininas que cobrem presets, corpos,
  # peles, cabelos, outfits e formatos disponíveis no workflow principal
  # ══════════════════════════════════════════════════════════════════════════
  smoke:
    name: "[${{ matrix.id }}] ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:

          - id: "FW01"
            label: "Athletic Woman — Pele africana, cabelo afro, sportsuit"
            character_id: "smoke_fw01"
            character_name: "Smoke FW01"
            preset: "Athletic woman"
            gender_age: "female:25"
            body: "athletic:average:tall"
            skin_tone: "african"
            hair: "afro01:black"
            facial_hair: "none"
            eyes: "darkbrown"
            outfit: "female_sportsuit01"
            shoes_hat: "sneakers:none"
            weapon: "none"
            expression: "determined"
            rig_anim: "game:yes:A"
            quality: "high"
            export_formats: "glb"

          - id: "FW02"
            label: "Female Executive — Pele asiática, bob preto, elegante"
            character_id: "smoke_fw02"
            character_name: "Smoke FW02"
            preset: "The Female Executive"
            gender_age: "female:35"
            body: "slim:slim:average"
            skin_tone: "asian"
            hair: "bob02:black"
            facial_hair: "none"
            eyes: "brown"
            outfit: "female_elegantsuit01"
            shoes_hat: "heels:none"
            weapon: "none"
            expression: "neutral"
            rig_anim: "game:no:T"
            quality: "medium"
            export_formats: "fbx"

          - id: "FW03"
            label: "Businesswoman — Pele caucasiana, cabelo longo louro, pantsuit"
            character_id: "smoke_fw03"
            character_name: "Smoke FW03"
            preset: "Businesswoman"
            gender_age: "female:30"
            body: "medium:average:average"
            skin_tone: "caucasian"
            hair: "long01:blonde"
            facial_hair: "none"
            eyes: "lightblue"
            outfit: "set_pantsuit"
            shoes_hat: "oxfords:none"
            weapon: "none"
            expression: "happy"
            rig_anim: "game:yes:A"
            quality: "high"
            export_formats: "glb,fbx"

          - id: "FW04"
            label: "Beach Girl — Pele clara, cabelo longo vermelho, casual"
            character_id: "smoke_fw04"
            character_name: "Smoke FW04"
            preset: "The Beach Girl"
            gender_age: "female:18"
            body: "slim:very slim:short"
            skin_tone: "light"
            hair: "long01:red"
            facial_hair: "none"
            eyes: "green"
            outfit: "female_casualsuit02"
            shoes_hat: "sandals:none"
            weapon: "none"
            expression: "happy"
            rig_anim: "game_lite:yes:A"
            quality: "medium"
            export_formats: "glb"

          - id: "FW05"
            label: "The Bride — Pele mista, box braids, vestido noiva"
            character_id: "smoke_fw05"
            character_name: "Smoke FW05"
            preset: "The Bride"
            gender_age: "female:25"
            body: "medium:average:average"
            skin_tone: "mixed"
            hair: "box_braids:black"
            facial_hair: "none"
            eyes: "brown"
            outfit: "set_wedding_gown"
            shoes_hat: "heels:none"
            weapon: "none"
            expression: "happy"
            rig_anim: "full:yes:T"
            quality: "high"
            export_formats: "glb"

          - id: "FW06"
            label: "Covert Spy — Pele escura, ponytail, techwear, faca"
            character_id: "smoke_fw06"
            character_name: "Smoke FW06"
            preset: "The Covert Spy"
            gender_age: "female:30"
            body: "athletic:slim:average"
            skin_tone: "dark"
            hair: "ponytail01:black"
            facial_hair: "none"
            eyes: "blackbrown"
            outfit: "techwear_jacket+techwear_pants"
            shoes_hat: "combat_boots:none"
            weapon: "knife"
            expression: "determined"
            rig_anim: "game:yes:A"
            quality: "high"
            export_formats: "glb,fbx"

          - id: "FW07"
            label: "Elder — Pele muito escura, cabelo curto cinza, sem arma"
            character_id: "smoke_fw07"
            character_name: "Smoke FW07"
            preset: "Elder"
            gender_age: "female:60"
            body: "medium:heavy:short"
            skin_tone: "very dark"
            hair: "short02:grey"
            facial_hair: "none"
            eyes: "darkbrown"
            outfit: "preset_default"
            shoes_hat: "shoes01:none"
            weapon: "none"
            expression: "sad"
            rig_anim: "game:yes:A"
            quality: "medium"
            export_formats: "glb"

    steps:
      - name: Validar inputs do caso ${{ matrix.id }}
        env:
          INPUT_FORMATS: ${{ matrix.export_formats }}
          INPUT_ID:      ${{ matrix.character_id }}
        run: |
          set -euo pipefail
          if ! echo "$INPUT_ID" | grep -qE '^[a-zA-Z0-9_\-]{1,80}$'; then
            echo "::error::character_id inválido: '$INPUT_ID'"
            exit 1
          fi
          ALLOWED="glb fbx obj zip"
          IFS=',' read -ra FMTS <<< "$INPUT_FORMATS"
          for fmt in "${FMTS[@]}"; do
            fmt_clean=$(echo "$fmt" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if ! echo "$ALLOWED" | grep -qw "$fmt_clean"; then
              echo "::error::Formato não suportado: '$fmt_clean'"
              exit 1
            fi
          done
          FORMATS_NORM=$(echo "$INPUT_FORMATS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "FORMATS_NORM=$FORMATS_NORM" >> "$GITHUB_ENV"
          echo "✅ [${{ matrix.id }}] Inputs validados."

      - name: Checkout AXEV
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clonar Ara 3D Gen
        run: git clone --depth 1 https://github.com/olatunde85/3d-gen.git ara-3d-gen

      - name: Instalar dependências
        working-directory: ara-3d-gen
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Cache assets MakeHuman
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            ara-3d-gen/vendor
            ara-3d-gen/public/assets
          key: ara3d-assets-v1-${{ hashFiles('ara-3d-gen/scripts/setup-assets.ts', 'ara-3d-gen/scripts/mocap-takes.ts') }}
          restore-keys: ara3d-assets-v1-

      - name: Preparar assets 3D
        working-directory: ara-3d-gen
        run: |
          if [ "${{ steps.cache-assets.outputs.cache-hit }}" != "true" ] || [ ! -d "vendor/sys/skins" ]; then
            echo "A descarregar assets MakeHuman (~280 MB)..."
            npm run setup-assets
          else
            echo "✅ Assets em cache."
          fi

      - name: Construir parâmetros [${{ matrix.id }}]
        env:
          INPUT_PRESET:      ${{ matrix.preset }}
          INPUT_NAME:        ${{ matrix.character_name }}
          INPUT_GENDER_AGE:  ${{ matrix.gender_age }}
          INPUT_BODY:        ${{ matrix.body }}
          INPUT_SKIN:        ${{ matrix.skin_tone }}
          INPUT_HAIR:        ${{ matrix.hair }}
          INPUT_FACIAL_HAIR: ${{ matrix.facial_hair }}
          INPUT_EYES:        ${{ matrix.eyes }}
          INPUT_OUTFIT:      ${{ matrix.outfit }}
          INPUT_SHOES_HAT:   ${{ matrix.shoes_hat }}
          INPUT_WEAPON:      ${{ matrix.weapon }}
          INPUT_EXPRESSION:  ${{ matrix.expression }}
          INPUT_RIG_ANIM:    ${{ matrix.rig_anim }}
          INPUT_QUALITY:     ${{ matrix.quality }}
        run: |
          mkdir -p axev-build
          python3 << 'PYEOF'
          import json, os

          def env(k, d=""): return os.environ.get(k, d).strip()

          preset = env("INPUT_PRESET", "Athletic woman")
          params = {
            "name": env("INPUT_NAME", preset) or preset,
            "detail": env("INPUT_QUALITY", "high").lower(),
          }

          ga = env("INPUT_GENDER_AGE", "female:25").split(":")
          gender_str = ga[0] if len(ga) > 0 else "female"
          age_str    = ga[1] if len(ga) > 1 else "25"
          params["gender"] = 0.0 if gender_str == "female" else (0.5 if gender_str == "androgynous" else 1.0)
          try:
            y = max(12, min(90, int(age_str)))
            params["age"] = round(0.5 + ((y-25)/65)*0.5 if y >= 25 else 0.1875 + ((y-11)/14)*0.3125 if y >= 11 else (y/11)*0.1875, 4)
          except: pass

          muscle_map = {"none":0.1,"slim":0.3,"medium":0.5,"athletic":0.7,"muscular":0.85,"very muscular":1.0}
          weight_map = {"very slim":0.15,"slim":0.3,"average":0.5,"heavy":0.7,"very heavy":0.9}
          height_map = {"very short":0.1,"short":0.3,"average":0.5,"tall":0.7,"very tall":0.9}
          body_parts = env("INPUT_BODY", "medium:average:average").split(":")
          if len(body_parts) >= 1: params["muscle"] = muscle_map.get(body_parts[0], 0.5)
          if len(body_parts) >= 2: params["weight"] = weight_map.get(body_parts[1], 0.5)
          if len(body_parts) >= 3: params["height"] = height_map.get(body_parts[2], 0.5)

          skin_map = {
            "very light":{"african":0.0,"asian":0.05,"caucasian":0.95},
            "light":     {"african":0.0,"asian":0.1, "caucasian":0.9},
            "mixed":     {"african":0.3,"asian":0.2, "caucasian":0.5},
            "dark":      {"african":0.7,"asian":0.1, "caucasian":0.2},
            "very dark": {"african":0.9,"asian":0.05,"caucasian":0.05},
            "african":   {"african":1.0,"asian":0.0, "caucasian":0.0},
            "asian":     {"african":0.0,"asian":1.0, "caucasian":0.0},
            "caucasian": {"african":0.0,"asian":0.0, "caucasian":1.0},
          }
          params.update(skin_map.get(env("INPUT_SKIN","mixed"), {"african":0.3,"asian":0.2,"caucasian":0.5}))

          hair_parts = env("INPUT_HAIR","long01:black").split(":")
          hair_style = hair_parts[0] if len(hair_parts) > 0 else "long01"
          hair_color = hair_parts[1] if len(hair_parts) > 1 else "black"
          if hair_style != "preset_default": params["hair"] = hair_style
          color_map = {"black":"#15100c","dark brown":"#241a13","brown":"#3b2a1d","blonde":"#c8a86b",
                       "red":"#7a2e14","grey":"#6a6060","white":"#c8c0b4","purple":"#4a1a6a","blue":"#1a2a6a","pink":"#c060a0"}
          hc = color_map.get(hair_color)
          if hc: params["hairColor"] = hc

          params["facialHair"] = "none"
          params["eyes"] = env("INPUT_EYES","brown")
          params["expression"] = env("INPUT_EXPRESSION","neutral")

          w = env("INPUT_WEAPON","none")
          if w not in ("preset_default",""): params["weapon"] = w

          outfit = env("INPUT_OUTFIT","preset_default")
          if outfit == "preset_default":
            pass
          elif "+" in outfit:
            top, bottom = outfit.split("+", 1)
            params["outfit"] = "none"
            params["top"] = top
            params["bottom"] = bottom
          elif outfit == "none":
            params["outfit"] = "none"
          else:
            params["outfit"] = outfit

          sh = env("INPUT_SHOES_HAT","preset_default:none").split(":")
          shoes = sh[0] if len(sh) > 0 else "preset_default"
          hat   = sh[1] if len(sh) > 1 else "none"
          if shoes not in ("preset_default",""): params["shoes"] = shoes
          if hat   not in ("preset_default",""): params["hat"] = hat

          ra = env("INPUT_RIG_ANIM","game:yes:A").split(":")
          params["rig"]        = ra[0] if len(ra) > 0 else "game"
          params["animations"] = (ra[1] if len(ra) > 1 else "yes") == "yes"
          params["restPose"]   = ra[2] if len(ra) > 2 else "A"
          params["faceShapes"]   = True
          params["speechShapes"] = True
          params["faceBones"]    = True

          with open("axev-build/character_overrides.json","w") as f:
            json.dump(params, f, indent=2)
          print("✅ Parâmetros prontos:")
          print(json.dumps(params, indent=2))
          PYEOF

      - name: Gerar personagem [${{ matrix.id }}]
        working-directory: ara-3d-gen
        env:
          FORMATS_NORM:    ${{ env.FORMATS_NORM }}
          RESOLVED_PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          mkdir -p out

          cat > merge-params.ts << 'TSEOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { DEFAULT_PARAMS, PRESETS } from './src/core/params';

          const presetName = process.env.RESOLVED_PRESET ?? 'Athletic woman';
          const preset = (PRESETS as Record<string, object>)[presetName] ?? {};
          const overrides = JSON.parse(readFileSync('../axev-build/character_overrides.json', 'utf8'));
          const final = { ...DEFAULT_PARAMS, ...preset, ...overrides };
          writeFileSync('../axev-build/character.params.json', JSON.stringify(final, null, 2));
          console.log(`✅ Preset "${presetName}" + ${Object.keys(overrides).length} overrides combinados.`);
          TSEOF

          npx tsx merge-params.ts

          echo "A gerar com formatos: $FORMATS_NORM"
          npm run export -- \
            --params "../axev-build/character.params.json" \
            --formats "$FORMATS_NORM" \
            --out out

          echo "✅ Geração concluída."
          find out -type f -printf '  %p (%s bytes)\n'

      - name: Validar ficheiros exportados [${{ matrix.id }}]
        env:
          FORMATS_NORM: ${{ env.FORMATS_NORM }}
        run: |
          set -euo pipefail
          OUT="ara-3d-gen/out"
          if [ ! -d "$OUT" ] || [ -z "$(find "$OUT" -type f -print -quit)" ]; then
            echo "::error::[${{ matrix.id }}] Nenhum ficheiro exportado."
            exit 1
          fi
          IFS=',' read -ra FMTS <<< "$FORMATS_NORM"
          for fmt in "${FMTS[@]}"; do
            fmt=$(echo "$fmt" | tr -d '[:space:]')
            FILES=$(find "$OUT" -name "*.${fmt}" -type f 2>/dev/null)
            if [ -z "$FILES" ]; then
              echo "::error::[${{ matrix.id }}] Formato $fmt não produzido."
              exit 1
            fi
            for f in $FILES; do
              SIZE=$(stat -c%s "$f")
              echo "✅ [${{ matrix.id }}] $fmt: $f ($(( SIZE / 1024 )) KB)"
            done
          done
          echo "✅ [${{ matrix.id }}] Todos os formatos validados."

      - name: Publicar artefacto [${{ matrix.id }}]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-women-${{ matrix.id }}-${{ matrix.character_id }}
          path: |
            ara-3d-gen/out/
            axev-build/character.params.json
          if-no-files-found: warn
          retention-days: 3

  report:
    name: "Relatório — Smoke Test Women"
    runs-on: ubuntu-latest
    needs: smoke
    if: always()

    steps:
      - name: Resumo dos resultados
        run: |
          echo "## 👩 AXEV Smoke Test Women — Resumo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Caso | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| FW01 | Athletic Woman — Pele africana, afro, sportsuit, GLB |" >> $GITHUB_STEP_SUMMARY
          echo "| FW02 | Female Executive — Asiática, bob preto, elegante, FBX |" >> $GITHUB_STEP_SUMMARY
          echo "| FW03 | Businesswoman — Caucasiana, cabelo longo louro, GLB+FBX |" >> $GITHUB_STEP_SUMMARY
          echo "| FW04 | Beach Girl — Pele clara, cabelo longo vermelho, GLB |" >> $GITHUB_STEP_SUMMARY
          echo "| FW05 | The Bride — Mista, box braids, vestido noiva, GLB |" >> $GITHUB_STEP_SUMMARY
          echo "| FW06 | Covert Spy — Pele escura, ponytail, techwear, faca, GLB+FBX |" >> $GITHUB_STEP_SUMMARY
          echo "| FW07 | Elder — Pele muito escura, cabelo cinza, 60 anos, GLB |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 7 combinações femininas — presets, corpos, peles, cabelos, outfits e formatos variados." >> $GITHUB_STEP_SUMMARY
