<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; background-color: #121212; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #FF9800; font-family: monospace; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading">INITIALIZING VISUALIZER...</div>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Grid Helper
            const grid = new THREE.GridHelper(10, 10, 0xFF9800, 0x333333);
            scene.add(grid);

            window.addEventListener('resize', onWindowResize, false);
            animate();

            document.getElementById('loading').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.loadModel = function(url) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = 'LOADING MODEL...';
            
            const loader = new GLTFLoader();
            loader.load(url, (gltf) => {
                scene.add(gltf.scene);
                document.getElementById('loading').style.display = 'none';
            }, undefined, (error) => {
                console.error(error);
                document.getElementById('loading').innerText = 'ERROR LOADING MODEL';
            });
        };

        init();
    </script>
</body>
</html>
